name: Extraer polígonos ISTAC de entidades y núcleos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extraer polígonos vectoriales oficiales ISTAC
        run: node scripts/extract-istac-polygons.mjs

      - name: Validar GeoJSON
        run: |
          test -s data/istac_entidades_poligonos.geojson
          test -s data/istac_nucleos_poligonos.geojson
          node - <<'NODE'
          const fs = require('fs');
          for (const f of ['data/istac_entidades_poligonos.geojson','data/istac_nucleos_poligonos.geojson']) {
            const g = JSON.parse(fs.readFileSync(f,'utf8'));
            if (g.type !== 'FeatureCollection' || !Array.isArray(g.features) || g.features.length === 0) throw new Error(`${f}: vacío`);
            const polys = g.features.filter(x => /^(Multi)?Polygon$/i.test(x?.geometry?.type || '')).length;
            if (!polys) throw new Error(`${f}: sin polígonos`);
            console.log(f, g.features.length, 'features /', polys, 'polígonos', g.anambro?.source || '');
          }
          NODE

      - name: Guardar polígonos en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/istac_entidades_poligonos.geojson data/istac_nucleos_poligonos.geojson data/istac_poligonos_fuentes.json
          if git diff --cached --quiet; then
            echo 'Sin cambios en los polígonos.'
            exit 0
          fi
          git commit -m 'Añadir polígonos ISTAC de entidades y núcleos'
          git pull --rebase origin main
          git push origin HEAD:main
