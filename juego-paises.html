<style>
:root{--azul:#17324d;--acento:#2e86de;--fondo:#f3f6f9;--borde:#d5dee7;--ok:#1e8449;--mal:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;color:#1d2a36;background:var(--fondo);line-height:1.4}
header{background:var(--azul);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
header h1{font-size:20px;margin:0} header .sub{font-size:14px;opacity:.85}
.marcador{margin-left:auto;display:flex;gap:14px;font-size:15px;font-weight:600}
.marcador span{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:14px}
main{max-width:1400px;margin:0 auto;padding:14px}
.panel{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px}
h2{font-size:18px;margin:0 0 8px;color:var(--azul)}
button{font:inherit;cursor:pointer}
.btn{background:var(--acento);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.sec{background:#e8eef4;color:var(--azul)} .btn:disabled{opacity:.45;cursor:default}
#inicio{max-width:900px;margin:20px auto}
.opciones{display:grid;gap:14px;margin:14px 0}
.opcion b{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--borde);background:#fff;border-radius:10px;padding:8px 12px;text-align:left}
.chip small{display:block;color:#5b6b7a;font-size:13px}
.chip.on{border-color:var(--acento);background:#eaf3fd}
.nota{font-size:14px;color:#5b6b7a}
#juego{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
#juego.soloOpc{grid-template-columns:minmax(0,1fr)}

#pregunta{font-size:22px;font-weight:700;color:var(--azul);margin:4px 0 10px}
#bandera img{max-width:100%;width:360px;border:1px solid var(--borde);border-radius:6px;box-shadow:0 2px 8px #0002;display:block;margin:6px 0 12px}
.opcResp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:760px}

.resp{border:2px solid var(--borde);background:#fff;border-radius:10px;padding:14px;font-size:18px;text-align:left}
.resp:hover:not(:disabled){border-color:var(--acento);background:#eaf3fd}
.resp.mal{border-color:var(--mal);background:#fdecea;color:#7b241c}
.resp.bien{border-color:var(--ok);background:#e9f7ef;color:#145a32;font-weight:700}
#mapa{height:600px;border-radius:12px;border:1px solid var(--borde);background:#cfe3f3}

#info{margin-top:12px}
.ficha{border:1px solid var(--borde);border-radius:10px;padding:12px;display:flex;gap:14px;align-items:flex-start;background:#fbfdff}
.ficha img{width:120px;border:1px solid var(--borde);border-radius:4px}
.ficha h3{margin:0 0 6px;color:var(--azul)}
.msg{font-weight:700;margin:8px 0;font-size:17px}
.msg.ok{color:var(--ok)} .msg.mal{color:var(--mal)}
.velo{position:fixed;inset:0;background:rgba(10,25,40,.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:12px}
.velo.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px}
table.acf{border-collapse:collapse;width:100%;font-size:14px} table.acf th,table.acf td{border:1px solid var(--borde);padding:5px;text-align:left} table.acf th{background:#eef3f8}
.puntos{font-size:34px;font-weight:800}
.fuente{font-size:12.5px;color:#5b6b7a;margin-top:10px}
.leaflet-tooltip.etq{font-size:14px;font-weight:700}
#miniMapa{height:340px;border-radius:10px;border:1px solid var(--borde);margin-top:10px;background:#cfe3f3}
.verAnb{margin-top:8px}
</style>
<style id="estiloJuegos">
/* ===== Aspecto renovado de los juegos (solo presentación; la mecánica no cambia) ===== */
:root{--k1:#e21b3c;--k2:#1368ce;--k3:#d89e00;--k4:#26890c;--sombra:0 6px 18px rgba(23,50,77,.14)}
body{background:radial-gradient(1200px 600px at 10% -10%,#e3eefa 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#e8f6ee 0,transparent 55%),var(--fondo)}
header{background:linear-gradient(120deg,#17324d 0%,#1f4f7a 55%,#2e86de 100%);box-shadow:0 3px 12px rgba(0,0,0,.18);position:sticky;top:0;z-index:1500}
header h1{font-size:22px;letter-spacing:.2px}
.marcador span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px)}
.marcador .barraProg{display:inline-block;width:140px;height:10px;padding:0;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;align-self:center}
.marcador .barraProg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ed6a5,#f9e15b);transition:width .5s ease}
.marcador .racha:empty{display:none}
.panel{border:0;border-radius:16px;box-shadow:var(--sombra)}
#inicio{border-top:6px solid var(--acento)}
#inicio h2{font-size:24px}
.opcion b{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#4a6178}
.chip{border-radius:14px;padding:10px 14px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(46,134,222,.18)}
.chip.on{background:linear-gradient(180deg,#f2f8ff,#e1efff);box-shadow:0 0 0 3px rgba(46,134,222,.18)}
.btn{border-radius:12px;padding:12px 22px;font-size:17px;box-shadow:0 4px 0 #1b5f9e;transition:transform .08s ease,box-shadow .08s ease}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1b5f9e}
.btn.sec{box-shadow:0 4px 0 #c3cfdb}
#btnEmpezar{font-size:20px;padding:14px 30px}
/* Tarjeta de pregunta */
#pregunta{font-size:26px;line-height:1.25;text-align:center;background:linear-gradient(135deg,#17324d,#2a5b8a);color:#fff;border-radius:14px;padding:18px 20px;margin:0 0 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
#pregunta b,#pregunta strong{color:#ffe07a}
#bandera{text-align:center}
#bandera img{width:min(440px,100%);margin:6px auto 16px;border:0;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:aparece .45s ease}
/* Respuestas tipo Kahoot */
.opcResp{max-width:none;gap:12px}
.resp{position:relative;color:#fff;border:0;border-radius:14px;padding:18px 16px 18px 58px;font-size:19px;font-weight:700;min-height:74px;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .1s ease,filter .15s,opacity .2s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.resp::before{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1;opacity:.95}
.resp:nth-child(4n+1){background:var(--k1)} .resp:nth-child(4n+1)::before{content:"▲"}
.resp:nth-child(4n+2){background:var(--k2)} .resp:nth-child(4n+2)::before{content:"◆"}
.resp:nth-child(4n+3){background:var(--k3)} .resp:nth-child(4n+3)::before{content:"●"}
.resp:nth-child(4n+4){background:var(--k4)} .resp:nth-child(4n+4)::before{content:"■"}
.resp:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.08);border:0;color:#fff}
.resp:nth-child(4n+1):hover:not(:disabled){background:var(--k1)} .resp:nth-child(4n+2):hover:not(:disabled){background:var(--k2)}
.resp:nth-child(4n+3):hover:not(:disabled){background:var(--k3)} .resp:nth-child(4n+4):hover:not(:disabled){background:var(--k4)}
.resp:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.resp:disabled{cursor:default;opacity:.35;filter:grayscale(.5)}
.resp.mal{opacity:.55;filter:grayscale(.2);animation:sacude .4s ease}
.resp.mal::after{content:"✖";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px}
.resp.bien{opacity:1;filter:none;box-shadow:0 0 0 4px #fff,0 0 0 8px #2ecc71,0 8px 20px rgba(46,204,113,.45);animation:salta .5s ease;color:#fff}
.resp.bien::after{content:"✔";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px}
/* Mensaje de resultado */
.msg{font-size:19px;text-align:center;border-radius:12px;padding:0;margin:14px 0 6px}
.msg.ok{background:#e6f8ee;color:#157347;padding:10px 12px;animation:aparece .35s ease}
.msg.mal{background:#fdecea;color:#a93226;padding:10px 12px;animation:aparece .35s ease}
.ficha{border:0;border-radius:14px;background:linear-gradient(180deg,#fbfdff,#f1f6fb);box-shadow:inset 0 0 0 1px var(--borde);padding:14px 16px;animation:aparece .4s ease}
.ficha img{width:150px;border:0;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.ficha h3{font-size:20px}
#miniMapa,#mapa{border:0;box-shadow:var(--sombra)}
#btnSig{display:block;margin:14px auto 0;font-size:19px}
/* Pantalla final */
.velo{backdrop-filter:blur(3px)}
.modal{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:aparece .35s ease}
.modal h2{font-size:22px}
.modal .puntos{font-size:54px;text-align:center;margin:6px 0}
.modal .puntos + p{text-align:center}
.modal .nota{text-align:center}
table.acf{border-radius:10px;overflow:hidden} table.acf th{background:#17324d;color:#fff} table.acf tr:nth-child(even) td{background:#f6f9fc}
@keyframes salta{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sacude{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){#pregunta{font-size:21px}.resp{font-size:17px;min-height:62px}}
</style>
</head>

function enAmbito(p){const a=CFG.ambito;if(a==="ccaa")return!!p.ccaa;if(p.ccaa)return false;return a==="mundo"||(a==="ue"?p.ue:a==="America"?p.cont.startsWith("América"):p.cont===a)}
function validos(){
  const base=TODOS.filter(enAmbito);
  if(CFG.tipo==="capitales")return base.filter(p=>p.cap);
  if(CFG.tipo==="idiomas")return esCCAA()?base.filter(p=>p.idiomas.length>1):base.filter(p=>p.idiomas.length);
  if(CFG.tipo==="monedas")return base.filter(p=>p.monedas.length);
  return base;
}
/* ---------- Preguntas ---------- */
function crearPregunta(p,pool){
  const t=CFG.tipo,mapaM=CFG.modo==="mapa";
  if(t==="capitales"){
    if(mapaM)return{txt:`¿Dónde está <b>${esc(p.cap)}</b>? Pulsa su ${UNI()}.`,correctos:[p.iso],pais:p};
    const distr=barajar(pool.filter(x=>x!==p&&x.cap)).slice(0,3).map(x=>x.cap);
    return{txt:`¿Cuál es la capital <b>${esc(deN(p))}</b>?`,ops:barajar([p.cap,...distr]),ok:[p.cap,...p.capAlt],pais:p};
  }
  if(t==="banderas"){
    if(mapaM)return{txt:`¿De qué ${UNIS()} es esta bandera? Pulsa ${esCCAA()?"la comunidad":"el país"}.`,bandera:p.iso,correctos:[p.iso],pais:p};
    const distr=barajar(pool.filter(x=>x!==p)).slice(0,3).map(x=>x.nom);
    return{txt:`¿De qué ${UNIS()} es esta bandera?`,bandera:p.iso,ops:barajar([p.nom,...distr]),ok:[p.nom],pais:p};
  }
  const campo=t==="idiomas"?"idiomas":"monedas",nomC=t==="idiomas"?"idioma oficial":"moneda";
  const valor=barajar(esCCAA()&&campo==="idiomas"&&p[campo].length>1?p[campo].filter(v=>v!=="castellano"):p[campo])[0];
  const todos=p[campo].concat(p.cooficiales||[]);
  if(mapaM){
    const correctos=pool.filter(x=>x[campo].includes(valor)).map(x=>x.iso);
    return{txt:`Pulsa ${esCCAA()?"una comunidad":"un país"} cuya ${t==="idiomas"?"lengua oficial sea el <b>"+esc(valor)+"</b>":"moneda sea el <b>"+esc(valor)+"</b>"}.`,correctos,valor,campo,pais:p};
  }
  const otros=[...new Set(pool.flatMap(x=>x[campo]))].filter(v=>!todos.includes(v));
  const distr=barajar(otros).slice(0,3);
  return{txt:t==="idiomas"?`¿Cuál de ${esCCAA()?"estas lenguas":"estos idiomas"} es oficial <b>${esc(enN(p))}</b>?`:`¿Cuál es la moneda de <b>${esc(p.nom)}</b>?`,ops:barajar([valor,...distr]),ok:todos,pais:p};
}
/* ---------- Llevar al mapa ---------- */
let GEO_MUNDO=null,GEO_CCAA=null;
function geoPais(iso){const g=iso&&iso.startsWith("ES-")?GEO_CCAA:GEO_MUNDO;return g?g.features.find(f=>f.properties.ISO_A2_EH===iso):null}
async function cargarGeoCCAA(){if(!GEO_CCAA){const g=await fetch("data/admin/egrn_ccaa.json").then(r=>r.json());const por=Object.fromEntries(CCAA.map(c=>[c.ine,c.iso]));g.features=g.features.filter(f=>por[f.properties.CodINE]);for(const f of g.features){f.properties.ISO_A2_EH=por[f.properties.CodINE];f.properties.NAME_ES=f.properties.NAMEUNIT}GEO_CCAA=g}return GEO_CCAA}
async function asegurarGeo(){if(esCCAA()){GEO=await cargarGeoCCAA()}else{if(!GEO_MUNDO)GEO_MUNDO=await fetch("data/admin/paises_50m.json").then(r=>r.json());GEO=GEO_MUNDO}return GEO}
function verEnAnambro(op){
  const P=window.parent;
  let PM=null;try{PM=P&&P!==window?P.eval("typeof map!=='undefined'?map:null"):null}catch(e){}
  if(!PM||!PM.addLayer||!P.L){alert("Para ir al mapa, abre el juego desde el menú Juegos de ANAMBRO.");return}
  try{if(P.__anJuegoMarca)PM.removeLayer(P.__anJuegoMarca)}catch(e){}
  const g=P.L.featureGroup();
  if(op.geos)for(const geo of op.geos)P.L.geoJSON(geo,{interactive:false,style:{color:"#d35400",weight:3,fillColor:"#f5b041",fillOpacity:.3}}).addTo(g);
  if(op.lat!=null)P.L.circleMarker([op.lat,op.lon],{radius:9,color:"#fff",weight:3,fillColor:"#c0392b",fillOpacity:1}).bindPopup(op.html||"").addTo(g);
  g.addTo(PM);P.__anJuegoMarca=g;
  try{P.closeAnambroExplanation&&P.closeAnambroExplanation()}catch(e){}
  setTimeout(()=>{try{if(op.geos&&op.geos.length)PM.flyToBounds(g.getBounds(),{maxZoom:op.zoom||7,duration:1.5,padding:[30,30]});else PM.flyTo([op.lat,op.lon],op.zoom||8,{duration:1.5})}catch(e){}
    setTimeout(()=>g.eachLayer(l=>{try{l.openPopup&&l.getPopup&&l.getPopup()&&l.openPopup()}catch(e){}}),1800)},300);
}
let mini=null;
async function mostrarMiniMapa(isos,p){
  await asegurarGeo();
  const cont=document.getElementById("miniMapa");if(!cont)return;
  if(mini){mini.remove();mini=null}
  mini=L.map(cont,{attributionControl:true,zoomControl:true,worldCopyJump:true});
  mini.attributionControl.addAttribution(esCCAA()?"Comunidades autónomas: IGN · EGRN (ANAMBRO)":"Fronteras: Natural Earth (ANAMBRO)");
  mini.setView(esCCAA()?[36,-8]:[20,0],esCCAA()?4:1);
  L.geoJSON(GEO,{interactive:false,style:f=>({color:"#9a9a9a",weight:.6,fillColor:"#ebe4d0",fillOpacity:1})}).addTo(mini);
  const sel=L.featureGroup();
  for(const iso of isos){const f=geoPais(iso);if(f)L.geoJSON(f,{interactive:false,style:{color:"#1e8449",weight:2,fillColor:"#2ecc71",fillOpacity:.75}}).addTo(sel)}
  sel.addTo(mini);
  if(CFG.tipo==="capitales"&&p&&p.capLL)L.circleMarker(p.capLL,{radius:7,color:"#fff",weight:2,fillColor:"#c0392b",fillOpacity:1}).bindTooltip(p.cap,{permanent:true,direction:"right",className:"etq"}).addTo(mini);
  mini.setView(esCCAA()?[36,-8]:[20,0],esCCAA()?4:1);
  const b=sel.getBounds();
  const m=mini;setTimeout(()=>{if(m!==mini||!document.body.contains(cont))return;m.invalidateSize();if(!b.isValid())return;
    const volar=()=>{if(m!==mini||!document.body.contains(cont))return;const sz=m.getSize();try{if(sz.x>60&&sz.y>60)m.flyToBounds(b,{maxZoom:esCCAA()?(isos.length>1?5:6):isos.length>1?4:6,duration:1.4,padding:[20,20]});else m.fitBounds(b,{maxZoom:esCCAA()?7:isos.length>1?4:6,animate:false})}catch(e){}};
    // Globo ligero: gira hasta el país (o la capital) y se acerca al mapa; luego el mapa vuela al país
    const fs=isos.map(i=>geoPais(i)).filter(Boolean);
    let cen=b.getCenter();if(fs.length&&window.AnbGlobo){const c=AnbGlobo.centro({type:"FeatureCollection",features:isos.length>1?[fs[0]]:fs});if(c)cen={lat:c.lat,lng:c.lon}}
    const capi=CFG.tipo==="capitales"&&p&&p.capLL;
    const globo=()=>window.AnbGlobo?AnbGlobo.mostrar(cont,{lat:capi?p.capLL[0]:cen.lat,lon:capi?p.capLL[1]:cen.lng,formas:{type:"FeatureCollection",features:fs},colorForma:"#2ecc71",sinPunto:!capi,nombre:capi?p.cap:"",color:"#c0392b"}).then(volar):volar();
    globo();
    if(window.AnbGlobo)AnbGlobo.boton(cont,()=>{try{m.setView(esCCAA()?[36,-8]:[20,0],esCCAA()?4:1,{animate:false})}catch(e){}globo()});
  },250);
}
function botonVer(isos,p){
  const html=p?`<b>${esc(p.nom)}</b>${p.cap?`<br>🏛️ ${esc(p.cap)}`:""}`:"";
  window.__opVer=()=>{asegurarGeo().then(()=>verEnAnambro({geos:isos.map(geoPais).filter(Boolean),lat:CFG.tipo==="capitales"&&p&&p.capLL?p.capLL[0]:null,lon:CFG.tipo==="capitales"&&p&&p.capLL?p.capLL[1]:null,html:G.q.valor?`<b>${esc(G.q.valor)}</b>`:html,zoom:isos.length>1?4:6}))};
  return`<button class="btn sec verAnb" onclick="__opVer()">🗺️ Ver en el mapa de ANAMBRO</button>`;
}

/* ---------- Partida ---------- */
function nuevaPartida(){
  if(esCCAA()&&CFG.tipo==="monedas"){alert("Las comunidades autónomas no tienen moneda propia: en toda España se usa el euro. Elige capitales, lenguas oficiales o banderas.");return}
  const pool=validos();
  if(pool.length<4){alert("No hay suficientes países en este ámbito.");return}
  const n=+CFG.rondas;let lista=[];while(lista.length<n)lista=lista.concat(barajar(pool));
  G={pool,rondas:lista.slice(0,n),n:0,total:0,hist:[]};
  $("inicio").style.display="none";$("juego").style.display="grid";$("marcador").style.display="flex";
  $("juego").classList.toggle("soloOpc",CFG.modo!=="mapa");$("panelMapa").style.display=CFG.modo==="mapa"?"":"none";
  $("titulo").textContent=esCCAA()?TIT_CCAA[CFG.tipo]:TIT[CFG.tipo];
  $("notaMapa").textContent=esCCAA()?"Pulsa una comunidad. Ceuta y Melilla tienen un punto para poder pulsarlas.":"Pulsa un país. Los países muy pequeños tienen un punto para poder pulsarlos.";
  if(CFG.modo==="mapa")prepararMapa().then(ronda);else ronda();
}
function ronda(){
  if(mini){try{mini.stop();mini.remove()}catch(e){}mini=null}
  const p=G.rondas[G.n];G.q=crearPregunta(p,G.pool);G.intentos=0;G.fin=false;
  $("pregunta").innerHTML=G.q.txt;
  $("bandera").innerHTML=G.q.bandera?`<img src="${BANDERA(G.q.bandera)}" alt="Bandera misteriosa">`:"";
  $("estado").textContent="";$("estado").className="msg";$("info").innerHTML="";$("btnSig").style.display="none";
  $("opciones").innerHTML=G.q.ops?G.q.ops.map((o,i)=>`<button class="resp" data-i="${i}">${esc(o)}</button>`).join(""):"";
  if(capa)capa.eachLayer(l=>l.setStyle(estiloBase(l.feature)));if(capaPuntos)capaPuntos.eachLayer(m=>m.setStyle({fillColor:"#e9dfc4"}));
  if(mapa)encuadrar();
  marcador();
}
function marcador(){$("mRonda").textContent=`Pregunta ${Math.min(G.n+1,G.rondas.length)}/${G.rondas.length}`;
  const hechas=G.hist.length;$("mNota").textContent=hechas?`Nota: ${fmtNota(G.total/(hechas*100)*10)} / 10`:"Nota: —";
  $("mBarra").style.width=(hechas/G.rondas.length*100)+"%";let r=0;for(let k=G.hist.length-1;k>=0&&G.hist[k].pts>0;k--)r++;$("mRacha").textContent=r>=2?`🔥 ${r} seguidas`:""}
function puntos(){return G.intentos===1?100:G.intentos===2?50:G.intentos===3?20:0}
function acabar(ok){
  G.fin=true;const pts=ok?puntos():0;G.total+=pts;G.hist.push({p:G.q.pais,pts,q:G.q});
  const st=$("estado");st.className="msg "+(ok?"ok":"mal");
  st.innerHTML=ok?`✅ ¡Correcto! +${pts} puntos`:`❌ No era. ${G.q.correctos?"Te lo marco en verde en el mapa.":"La respuesta correcta está en verde."}`;
  let extra="";
  if(G.q.valor){const otros=(G.q.correctos||G.pool.filter(x=>x[G.q.campo].includes(G.q.valor)).map(x=>x.iso)).map(i=>POR_ISO[i]?.nom).filter(Boolean);extra=`<br>${G.q.campo==="idiomas"?"🗣️ El "+esc(G.q.valor)+" es oficial en":"💰 El "+esc(G.q.valor)+" se usa en"}: ${esc(otros.join(", "))}.`}
  const isos=G.q.correctos||(G.q.valor?G.pool.filter(x=>x[G.q.campo||""]?.includes?.(G.q.valor)).map(x=>x.iso):[G.q.pais.iso]);
  let isosMapa=G.q.valor?(G.q.correctos||TODOS.filter(x=>enAmbito(x)).filter(x=>x[CFG.tipo==="idiomas"?"idiomas":"monedas"].includes(G.q.valor)).map(x=>x.iso)):[G.q.pais.iso];
  $("info").innerHTML=(G.q.valor?`<div class="ficha"><div>${extra.slice(4)}</div></div>`:ficha(G.q.pais))+(CFG.modo!=="mapa"?`<div id="miniMapa"></div>`:"")+botonVer(isosMapa,G.q.valor?null:G.q.pais);
  if(CFG.modo!=="mapa")mostrarMiniMapa(isosMapa,G.q.pais);
  else if(CFG.tipo==="capitales"&&G.q.pais.capLL&&mapa){G.marcaCap&&mapa.removeLayer(G.marcaCap);G.marcaCap=L.circleMarker(G.q.pais.capLL,{radius:8,color:"#fff",weight:2,fillColor:"#c0392b",fillOpacity:1}).bindTooltip(G.q.pais.cap,{permanent:true,direction:"right",className:"etq"}).addTo(mapa)}
  $("btnSig").style.display="";$("btnSig").textContent=G.n+1<G.rondas.length?"Siguiente ▶":"Ver resultado ▶";
  if(G.q.correctos)marcarCorrectos();
  marcador();
}
function responderOpcion(i){
  if(G.fin)return;const b=document.querySelector(`.resp[data-i="${i}"]`);if(b.disabled)return;
  G.intentos++;const v=G.q.ops[i];
  if(G.q.ok.includes(v)){b.classList.add("bien");document.querySelectorAll(".resp").forEach(x=>x.disabled=true);acabar(true)}
  else{b.classList.add("mal");b.disabled=true;
    if(G.intentos>=3){document.querySelectorAll(".resp").forEach(x=>{if(G.q.ok.includes(G.q.ops[+x.dataset.i]))x.classList.add("bien");x.disabled=true});acabar(false)}
    else{$("estado").className="msg mal";$("estado").textContent="No es esa. Prueba otra vez."}}
}
/* ---------- Mapa mudo ---------- */
function estiloBase(f){const iso=f.properties.ISO_A2_EH,dentro=POR_ISO[iso]&&(enAmbito(POR_ISO[iso])||esCCAA());
  return{color:"#8a8a8a",weight:.8,fillColor:dentro?"#e9dfc4":iso==="EH"?"#d9d4c7":"#d6d6d6",fillOpacity:1}}
let mapaDe=null;
async function prepararMapa(){
  await asegurarGeo();const modo=esCCAA()?"ccaa":"mundo";
  if(!mapa){mapa=L.map("mapa",{worldCopyJump:true,minZoom:1,attributionControl:true})}
  if(mapaDe!==modo){
    if(capa){mapa.removeLayer(capa);capa=null}if(capaPuntos){mapa.removeLayer(capaPuntos);capaPuntos=null}
    try{mapa.attributionControl.removeAttribution("Fronteras: Natural Earth (ANAMBRO)");mapa.attributionControl.removeAttribution("Comunidades autónomas: IGN · EGRN (ANAMBRO)")}catch(e){}
    mapa.attributionControl.addAttribution(modo==="ccaa"?"Comunidades autónomas: IGN · EGRN (ANAMBRO)":"Fronteras: Natural Earth (ANAMBRO)");
    capa=L.geoJSON(GEO,{style:estiloBase,onEachFeature:(f,l)=>l.on("click",()=>pulsarPais(f.properties.ISO_A2_EH,l))}).addTo(mapa);
    // punto para los territorios demasiado pequeños para pulsarlos
    capaPuntos=L.layerGroup().addTo(mapa);
    for(const f of GEO.features){const b=L.geoJSON(f).getBounds();const tam=Math.abs(b.getNorth()-b.getSouth())*Math.abs(b.getEast()-b.getWest());
      const iso=f.properties.ISO_A2_EH;if(tam<(modo==="ccaa"?0.02:0.6)&&POR_ISO[iso]){const c=[f.properties.LABEL_Y??b.getCenter().lat,f.properties.LABEL_X??b.getCenter().lng];
        const m=L.circleMarker(c,{radius:7,color:"#555",weight:1,fillColor:"#e9dfc4",fillOpacity:1});m._iso=iso;m.on("click",()=>pulsarPais(iso,null,m));m.addTo(capaPuntos)}}
    mapaDe=modo;
  }
  setTimeout(()=>mapa.invalidateSize(),50);
}
function encuadrar(){
  const B={ccaa:[[27.4,-18.3],[44.2,4.5]],mundo:[[-50,-170],[75,190]],Europa:[[34,-25],[71,45]],ue:[[34,-25],[71,45]],"África":[[-36,-26],[38,60]],America:[[-56,-170],[72,-30]],Asia:[[-11,25],[56,150]],"Oceanía":[[-48,110],[10,190]]};
  mapa.fitBounds(B[CFG.ambito]||B.mundo);
}
function nombreIso(iso){if(iso==="EH")return"Sáhara Occidental (territorio ocupado)";if(POR_ISO[iso])return POR_ISO[iso].nom;const f=GEO.features.find(f=>f.properties.ISO_A2_EH===iso);return f?(f.properties.NAME_ES||f.properties.NAME):"ese territorio"}
function pulsarPais(iso,l,m){
  if(!G||G.fin||CFG.modo!=="mapa")return;
  G.intentos++;
  const ok=G.q.correctos.includes(iso);
  const pintar=(color)=>{if(l)l.setStyle({fillColor:color});if(m)m.setStyle({fillColor:color});else capaPuntos.eachLayer(x=>{if(x._iso===iso)x.setStyle({fillColor:color})})};
  if(ok){pintar("#2ecc71");const capaP=l||m;capaP.bindTooltip(nombreIso(iso),{permanent:true,className:"etq"}).openTooltip();acabar(true);return}
  pintar("#e74c3c");(l||m).bindTooltip("Eso es "+nombreIso(iso),{className:"etq"}).openTooltip();
  if(G.intentos>=3)acabar(false);else{$("estado").className="msg mal";$("estado").textContent=`No: eso es ${nombreIso(iso)}. Prueba otra vez.`}
}
function marcarCorrectos(){
  const set=new Set(G.q.correctos);
  capa.eachLayer(l=>{const iso=l.feature.properties.ISO_A2_EH;if(set.has(iso)){l.setStyle({fillColor:"#2ecc71"});if(set.size===1)l.bindTooltip(nombreIso(iso),{permanent:true,className:"etq"}).openTooltip()}});
  capaPuntos.eachLayer(m=>{if(set.has(m._iso))m.setStyle({fillColor:"#2ecc71"})});
}
function siguiente(){
  if(G&&G.marcaCap&&mapa){mapa.removeLayer(G.marcaCap);G.marcaCap=null}
  if(capa)capa.eachLayer(l=>{l.unbindTooltip()});if(capaPuntos)capaPuntos.eachLayer(m=>m.unbindTooltip());
  G.n++;if(G.n<G.rondas.length){ronda();return}
  const nota=G.total/(G.rondas.length*100)*10;
  $("modal").innerHTML=`<h2>Fin de la partida · ${TIT[CFG.tipo]}</h2><div class="puntos" style="color:${nota<5?"#c0392b":"#1e8449"}">Nota: ${fmtNota(nota)} / 10</div>
    <p style="font-size:18px">${(nota>=9?"🏆 ":nota>=7?"🥈 ":nota>=5?"🥉 ":"📚 ")+nivelNota(nota)}</p><div class="nota">${G.total} de ${G.rondas.length*100} puntos posibles</div>
    <table class="acf"><tr><th>#</th><th>${esCCAA()?"Comunidad":"País"}</th><th>Respuesta</th><th>Puntos</th><th>Nota</th></tr>${G.hist.map((h,i)=>`<tr><td>${i+1}</td><td>${esc(h.p.nom)}</td><td>${esc(h.q.valor||(CFG.tipo==="capitales"?h.p.cap:CFG.tipo==="banderas"?h.p.nom:""))}</td><td>${h.pts}</td><td>${fmtNota(h.pts/10)}</td></tr>`).join("")}</table>
    <p><button class="btn" id="btnOtra">Otra partida</button> <button class="btn sec" id="btnMenu">Cambiar opciones</button></p>
    <div class="fuente">Datos de capitales, idiomas y monedas: mledoze/countries (ODbL), con nombres en español de Unicode CLDR. Banderas: flag-icons (MIT). Fronteras: Natural Earth.${esCCAA()?" Comunidades autónomas: IGN (EGRN); banderas autonómicas: Wikimedia Commons.":""}</div>`;
  $("velo").classList.add("on");
  $("btnOtra").onclick=()=>{$("velo").classList.remove("on");nuevaPartida()};
  $("btnMenu").onclick=()=>{$("velo").classList.remove("on");$("juego").style.display="none";$("marcador").style.display="none";$("inicio").style.display="block"};
}
document.querySelectorAll(".chips").forEach(g=>g.addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;
  g.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));CFG[g.dataset.grupo]=b.dataset.v;if(g.dataset.grupo==="tipo")$("titulo").textContent=TIT[CFG.tipo]}));
$("opciones").addEventListener("click",ev=>{const b=ev.target.closest(".resp");if(b)responderOpcion(+b.dataset.i)});
$("btnSig").onclick=siguiente;$("btnEmpezar").onclick=nuevaPartida;
$("btnEmpezar").disabled=false;$("btnEmpezar").textContent="▶ Empezar partida";
window.__paises={PAISES,CCAA,validos};
</script>
<style id="anSalidaCss">
/* ===== Salir de la partida y volver al menú de Juegos ===== */
.anSalida{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
header .marcador[style*="flex"] ~ .anSalida{margin-left:0}
.anSalida button{font:inherit;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:6px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.anSalida button:hover{background:rgba(255,255,255,.28)}
.anSalida button[hidden]{display:none}
</style>
<script>
/* ANAMBRO · Terminar la partida en cualquier momento y volver al menú «Juegos» (2026-11-19).
   «Terminar partida» vuelve a la pantalla de opciones conservando las que estaban elegidas. */
(function(){
  const $=id=>document.getElementById(id);
  const head=document.querySelector("header");if(!head||$("anSalida"))return;
  const P=window.parent!==window?window.parent:null;
  let enAnambro=false;try{enAnambro=!!(P&&typeof P.closeAnambroExplanation==="function")}catch(e){}
  const caja=document.createElement("div");caja.className="anSalida";caja.id="anSalida";
  caja.innerHTML='<button type="button" id="anTerminar" hidden title="Abandona la partida y vuelve a las opciones">⏹ Terminar partida</button>'+
    (enAnambro?'<button type="button" id="anMenuJuegos" title="Cierra el juego y abre el menú Juegos de ANAMBRO">🎮 Menú de juegos</button>':"");
  head.appendChild(caja);
  const CLAVE="anambro.juego.opciones."+location.pathname+location.search;
  function guardar(){
    const o={chips:{},sel:{}};
    document.querySelectorAll(".chips[data-grupo]").forEach(g=>{o.chips[g.dataset.grupo]=[...g.querySelectorAll(".chip.on")].map(c=>c.dataset.v)});
    document.querySelectorAll("#inicio select[id]").forEach(s=>{o.sel[s.id]=s.value});
    try{sessionStorage.setItem(CLAVE,JSON.stringify(o))}catch(e){}
  }
  function restaurar(){
    let o=null;try{o=JSON.parse(sessionStorage.getItem(CLAVE)||"null");sessionStorage.removeItem(CLAVE)}catch(e){}
    if(!o)return;
    for(const g in o.chips||{})for(const v of o.chips[g]){const c=document.querySelector(`.chips[data-grupo="${g}"] .chip[data-v="${v}"]`);if(c&&!c.classList.contains("on")&&!c.disabled)c.click()}
    const ids=Object.keys(o.sel||{});let i=0;
    (function sigSel(){if(i>=ids.length)return;const s=$(ids[i]),v=o.sel[ids[i]];i++;
      if(s&&[...s.options].some(x=>x.value===v)&&s.value!==v){s.value=v;s.dispatchEvent(new Event("change",{bubbles:true}))}
      setTimeout(sigSel,150)})();
  }
  $("anTerminar").onclick=()=>{guardar();location.reload()};
  if($("anMenuJuegos"))$("anMenuJuegos").onclick=()=>{
    try{
      const D=P.document,pan=D.getElementById("territorialGamePanel");
      P.closeAnambroExplanation();
      if(pan&&pan.classList.contains("hidden")&&typeof P.togglePanel==="function")P.togglePanel("territorialGamePanel");
    }catch(e){console.warn("Menú de juegos",e)}
  };
  // «Terminar partida» solo se ve mientras hay una partida en marcha
  const juego=$("juego"),ver=()=>{$("anTerminar").hidden=!juego||getComputedStyle(juego).display==="none"};
  if(juego)new MutationObserver(ver).observe(juego,{attributes:true,attributeFilter:["style","class"]});
  ver();
  // se restauran cuando el juego ha terminado de cargar sus datos (botón «Empezar» activo)
  let n=0;(function espera(){const b=$("btnEmpezar");if((b&&!b.disabled)||n++>300)setTimeout(restaurar,150);else setTimeout(espera,200)})();
})();
</script>
