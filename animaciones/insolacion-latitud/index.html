<style>

<!-- 0 · Dos lugares sobre superficies planas -->
<g id="scene0" class="sceneGroup active">
 <text class="bigQuestion" x="490" y="70">Empecemos sin suponer que la Tierra es redonda</text>

 <text class="label" x="250" y="155" text-anchor="middle">Siena / Siene (actual Asuán)</text><text class="label" x="730" y="155" text-anchor="middle">Alejandría</text>

<!-- 1 · Eratóstenes lee la noticia del pozo -->
<g id="scene1" class="sceneGroup">
 <text class="label" x="225" y="78" text-anchor="middle">Alejandría</text><line class="ground" x1="55" y1="450" x2="455" y2="450"/><use href="#egyptTown" transform="translate(75 382) scale(.9)"/>

 <circle cx="715" cy="160" r="34" fill="#ffd35c"/><text x="715" y="166" text-anchor="middle" fill="#684b00" font-size="12" font-weight="950">SOL</text><text class="gold" x="715" y="525" text-anchor="middle" font-size="18">La luz alcanza el fondo del pozo</text>
</g>

<!-- 2 · El experimento de Alejandría -->
<g id="scene2" class="sceneGroup">
 <text class="bigQuestion" x="490" y="70">¿Sucederá lo mismo aquí, en Alejandría?</text><use href="#egyptTown" transform="translate(90 405) scale(.9)"/><line class="ground" x1="60" y1="474" x2="920" y2="474"/>

</g>

<!-- 3 · La observación imposible -->
<g id="scene3" class="sceneGroup">
 <text class="bigQuestion" x="490" y="64">¿Cómo puede haber sombra en un lugar y en el otro no?</text>
 <rect class="panelBox" x="45" y="105" width="420" height="360" rx="18"/><rect class="panelBox" x="515" y="105" width="420" height="360" rx="18"/>
 <text class="label" x="255" y="140" text-anchor="middle">Siena</text><text class="label" x="725" y="140" text-anchor="middle">Alejandría</text>
 <line class="ground" x1="95" y1="342" x2="415" y2="342"/><rect class="wellWall" x="190" y="342" width="125" height="30"/><rect class="wellDark" x="215" y="342" width="75" height="90"/><rect class="wellWall" x="190" y="372" width="25" height="60"/><rect class="wellWall" x="290" y="372" width="25" height="60"/><line class="rayStrong" x1="240" y1="170" x2="240" y2="425"/><line class="rayStrong" x1="265" y1="170" x2="265" y2="425"/><text class="gold" x="255" y="455" text-anchor="middle" font-size="17">Sin sombra</text>

</g>

<!-- 4 · Modelo de Tierra plana -->
<g id="scene4" class="sceneGroup">
 <text class="bigQuestion" x="490" y="58">Probemos la hipótesis de una Tierra plana</text>
 <rect class="panelBox" x="42" y="90" width="896" height="210" rx="18"/><text class="caseTitle" x="490" y="120">CASO A · rayos perpendiculares</text><line class="ground" x1="110" y1="250" x2="870" y2="250"/><line class="gnomon" x1="330" y1="250" x2="330" y2="172"/><line class="gnomon" x1="650" y1="250" x2="650" y2="172"/><line class="rayStrong" x1="330" y1="135" x2="330" y2="172"/><line class="rayStrong" x1="650" y1="135" x2="650" y2="172"/><text class="subLabel" x="330" y="276" text-anchor="middle">Siena</text><text class="subLabel" x="650" y="276" text-anchor="middle">Alejandría</text><text class="gold" x="490" y="291" text-anchor="middle" font-size="16">Resultado: ningún palo proyecta sombra</text>
 <rect class="panelBox" x="42" y="326" width="896" height="210" rx="18"/><text class="caseTitle" x="490" y="356">CASO B · rayos oblicuos pero paralelos</text><line class="ground" x1="110" y1="487" x2="870" y2="487"/><line class="gnomon" x1="330" y1="487" x2="330" y2="409"/><line class="gnomon" x1="650" y1="487" x2="650" y2="409"/><line class="rayStrong" x1="230" y1="372" x2="330" y2="409"/><line class="rayStrong" x1="550" y1="372" x2="650" y2="409"/><line class="shadow" x1="330" y1="487" x2="405" y2="487"/><line class="shadow" x1="650" y1="487" x2="725" y2="487"/><text class="subLabel" x="330" y="513" text-anchor="middle">Siena</text><text class="subLabel" x="650" y="513" text-anchor="middle">Alejandría</text><text class="gold" x="490" y="527" text-anchor="middle" font-size="16">Resultado: la misma sombra en los dos</text>
</g>

<!-- 5 · La contradicción obliga a curvar -->
<g id="scene5" class="sceneGroup">
 <text class="bigQuestion" x="490" y="105">Pero eso NO es lo que observamos</text><text class="bigQuestion" x="490" y="160">Entonces… ¿cómo puede ser?</text>
 <path class="arcSurface" d="M170 430 Q490 250 810 430"/><line class="arrowLine" x1="490" y1="230" x2="490" y2="320"/><text class="answer" x="490" y="505">La superficie de la Tierra tiene que ser CURVA</text><text class="subLabel" x="490" y="540" text-anchor="middle">No cambian los rayos solares: cambia la orientación del suelo en cada lugar.</text>
</g>

<!-- 6 · Sobre una superficie curva sí es posible -->

 <text class="bigQuestion" x="490" y="58">En una superficie curva, sí encaja</text>

 <!-- Siena: punto superior del arco -->

 <!-- Alejandría a 7,2 grados sobre el mismo arco -->
 <circle class="cityDot" cx="442.3" cy="244.9" r="8" fill="#ff996b"/><line class="gnomon" x1="442.3" y1="244.9" x2="431.7" y2="160.6"/><line class="rayStrong" x1="431.7" y1="85" x2="431.7" y2="160.6"/><line class="shadow" x1="442.3" y1="244.9" x2="511.7" y2="236.1"/><text class="label" x="335" y="216">Alejandría</text><text class="red" x="330" y="278" font-size="15">sombra visible</text>
 <line class="radius" x1="520" y1="240" x2="520" y2="430" opacity=".5"/><line class="radius" x1="442.3" y1="244.9" x2="466" y2="433" opacity=".5"/>
 <text class="subLabel" x="490" y="500" text-anchor="middle">Los rayos siguen siendo paralelos. Los palos no: cada uno es perpendicular a su suelo local.</text>
</g>

<!-- 7 · prolongar la curva hasta una esfera -->
<g id="scene7" class="sceneGroup">
 <text class="bigQuestion" x="490" y="65">¿Qué forma obtengo si prolongo la curvatura?</text>

 <circle class="drawSphere" cx="520" cy="310" r="200"/>
 <g class="fadeLand"><circle class="earth" cx="520" cy="310" r="197" opacity=".9"/><g clip-path="url(#globeClip)"><use href="#worldLand"/></g><circle cx="520" cy="310" r="200" fill="none" stroke="#c9efff" stroke-width="3"/>
 <circle class="cityDot" cx="520" cy="110" r="7" fill="#ffd35c"/><circle class="cityDot" cx="494.9" cy="111.6" r="7" fill="#ff996b"/><line x1="520" y1="110" x2="610" y2="88" stroke="#fff"/><text class="label" x="620" y="92">Siena</text><line x1="494.9" y1="111.6" x2="385" y2="93" stroke="#fff"/><text class="label" x="280" y="98">Alejandría</text></g>
 <text class="answer" x="490" y="565">Una esfera</text>
</g>

<!-- 8 · 7,2 grados al centro -->
<g id="scene8" class="sceneGroup">

<div id="caption" class="caption"></div></section>
<aside class="side"><h2 id="sideTitle"></h2><p id="sideText"></p><div class="quote" id="quote"></div><div class="fact" id="fact"></div><div class="math hidden" id="mathBox"><div class="eq">7,2° = 1/50 de 360°</div><div class="eq">800 km × 50 = 40.000 km</div></div><div class="try hidden" id="tryBox"><b>🧠 Hazlo tú</b><p>Cambia el ángulo o la distancia y comprueba la proporción.</p><div class="tryGrid"><label><span class="small">Ángulo (°)</span><input id="angleInput" type="number" value="7.2" step="0.1"></label><label><span class="small">Distancia (km)</span><input id="distInput" type="number" value="800" step="10"></label></div><button class="calcBtn" id="calc">Calcular circunferencia</button><div class="result" id="result">≈ 40.000 km</div></div></aside></main>
<footer class="bottom">
<button class="stepBtn active" data-step="0">1 · Dos ciudades</button><button class="stepBtn" data-step="1">2 · El pozo</button><button class="stepBtn" data-step="2">3 · Experimento</button><button class="stepBtn" data-step="3">4 · La sorpresa</button><button class="stepBtn" data-step="4">5 · Tierra plana</button><button class="stepBtn" data-step="5">6 · La pregunta</button><button class="stepBtn" data-step="6">7 · Curvatura</button><button class="stepBtn" data-step="7">8 · Esfera</button><button class="stepBtn" data-step="8">9 · 7,2°</button><button class="stepBtn" data-step="9">10 · 1/50</button><button class="stepBtn" data-step="10">11 · 800 km</button><button class="stepBtn" data-step="11">12 · Cálculo</button><button class="stepBtn" data-step="12">13 · Curiosidad</button>
</footer></div>
<script>
(()=>{
 const $=id=>document.getElementById(id);let step=0,timer=null;
 const steps=[
  {title:'🏜️ Dos lugares reales',text:'No empezamos suponiendo una Tierra esférica. Solo tenemos dos ciudades egipcias, Siena y Alejandría, y dos superficies locales que a simple vista parecen planas.',cap:'Primero: dos ciudades reales de Egipto. Todavía no damos por supuesta la forma de la Tierra.',fact:'Siena (actual Asuán) está al sur de Alejandría.',quote:'¿Qué podemos averiguar observando solamente el Sol y las sombras?',ms:5200},
  {title:'📜 La noticia de Siena',text:'En Alejandría, Eratóstenes conoce una observación llamativa: el 21 de junio, al mediodía, la luz del Sol alcanza el fondo de un pozo en Siena.',cap:'21 de junio · Siena: los rayos entran perpendicularmente en el pozo y llegan hasta el fondo.',fact:'En Siena, el Sol está prácticamente en el cenit al mediodía del solsticio.',quote:'Una observación aparentemente pequeña puede abrir una pregunta enorme.',ms:5800},
  {title:'🧪 ¿Y en Alejandría?',text:'Eratóstenes se pregunta si ocurrirá lo mismo en su ciudad. Decide colocar un palo vertical en Alejandría el mismo día y a la misma hora.',cap:'Mismo día. Misma hora. Un palo vertical en Alejandría… y aparece una sombra.',fact:'El palo de Alejandría sí proyecta una sombra.',quote:'¿Por qué aquí hay sombra si en Siena el Sol cae verticalmente?',ms:5600},
  {title:'❓ La contradicción',text:'Al mismo tiempo, Siena no presenta sombra apreciable y Alejandría sí. La diferencia solo puede estar en el ángulo con el que los rayos encuentran la superficie local.',cap:'Siena: sin sombra. Alejandría: sombra. ¿Cómo puede suceder al mismo tiempo?',fact:'Los rayos solares llegan prácticamente paralelos a la Tierra.',quote:'No necesitamos cambiar el Sol: necesitamos explicar por qué cambia el ángulo respecto al suelo.',ms:5900},
  {title:'▱ Probemos una Tierra plana',text:'Si las dos ciudades estuvieran sobre una misma superficie plana y los rayos fueran paralelos, solo hay dos posibilidades: o no habría sombra en ninguna, o ambas tendrían exactamente la misma sombra.',cap:'En una superficie plana, rayos paralelos producen el mismo ángulo de incidencia en los dos palos.',fact:'Tierra plana + rayos paralelos no reproduce la observación real.',quote:'El modelo plano falla.',ms:6500},
  {title:'💡 ¿Cómo puede ser?',text:'Pero la realidad es distinta: Siena y Alejandría no muestran la misma sombra. Si los rayos siguen siendo paralelos, la orientación del suelo no puede ser la misma en ambos lugares.',cap:'La observación obliga a cambiar el modelo: la superficie de la Tierra debe ser curva.',fact:'La curvatura explica que dos verticales locales tengan orientaciones diferentes.',quote:'La superficie de la Tierra es curva.',ms:5600},
  {title:'🌐 Sobre una superficie curva',text:'Ahora colocamos los dos palos sobre una misma superficie curva. Los rayos siguen siendo paralelos, pero cada palo es perpendicular a su propio suelo local.',cap:'Siena y Alejandría sobre la misma curvatura: un palo no proyecta sombra y el otro sí.',fact:'En Siena el rayo coincide con la vertical local; en Alejandría forma un ángulo.',quote:'Ahora la observación encaja sin cambiar la dirección de los rayos solares.',ms:6500},
  {title:'🌍 De la curva a la esfera',text:'Prolongamos esa curvatura de forma continua. La línea se cierra y obtenemos una esfera. Siena y Alejandría forman parte de la misma superficie terrestre.',cap:'Prolongamos la curva hasta cerrar la Tierra: aparece una esfera con los continentes reales.',fact:'La curvatura local pertenece a una superficie esférica.',quote:'La forma global aparece al prolongar la geometría local.',ms:6000},
  {title:'📐 Los 7,2°',text:'La sombra de Alejandría permite medir una diferencia angular de 7,2°. Prolongamos las verticales de Siena y Alejandría hasta el centro de la Tierra: allí aparece el mismo ángulo.',cap:'El ángulo de 7,2° medido en Alejandría se proyecta hasta el centro de la Tierra.',fact:'Ángulo en Alejandría = ángulo central entre Siena y Alejandría.',quote:'La geometría de una sombra se convierte en geometría planetaria.',math:true,ms:6200},
  {title:'⭕ Una cincuentava parte',text:'Una circunferencia completa tiene 360°. Como 360 ÷ 7,2 = 50, el arco entre Siena y Alejandría representa 1/50 de toda la circunferencia terrestre.',cap:'7,2° es exactamente 1/50 de 360°.',fact:'7,2° × 50 = 360°.',quote:'Si conocemos la distancia de ese pequeño arco, podemos reconstruir la vuelta completa.',math:true,ms:6100},
  {title:'📏 La distancia',text:'Ahora necesitamos una longitud. Para esta explicación usamos 800 kilómetros entre Siena y Alejandría.',cap:'Siena ↔ Alejandría = 800 km, y esos 800 km representan 1/50 de la circunferencia.',fact:'800 km corresponden al arco de 7,2°.',quote:'Ya tenemos el ángulo y la distancia. Solo falta una multiplicación.',math:true,ms:5600},
  {title:'✨ La Tierra medida',text:'Si 800 km son 1/50 de la circunferencia, multiplicamos por 50. El resultado es 40.000 km.',cap:'800 × 50 = 40.000 km. El tamaño del mundo aparece a partir de una sombra.',fact:'Circunferencia terrestre ≈ 40.000 km.',quote:'Una pregunta, una sombra y matemáticas elementales bastaron para medir el mundo.',math:true,try:true,ms:6500},
  {title:'🧠 El verdadero motor',text:'Eratóstenes no necesitó satélites ni GPS. Necesitó observación, dos lugares, un palo, una sombra, matemáticas elementales y un cerebro dispuesto a hacerse preguntas.',cap:'El motor de la genialidad humana es la curiosidad.',fact:'Observar · Preguntar · Pensar · Calcular · Comprender.',quote:'La curiosidad convierte una sombra en una medida del planeta.',math:true,ms:9000}
 ];
 function buildFiftieths(){const g=$('fiftyTicks');if(!g)return;const cx=355,cy=315,r1=169,r2=185;for(let i=0;i<50;i++){const a=(-90+i*7.2)*Math.PI/180,x1=cx+r1*Math.cos(a),y1=cy+r1*Math.sin(a),x2=cx+r2*Math.cos(a),y2=cy+r2*Math.sin(a),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('class','fiftyTick'+(i===0?' hot':''));g.appendChild(l);}}
 function setStep(n){step=Math.max(0,Math.min(steps.length-1,n));document.querySelectorAll('.sceneGroup').forEach((g,i)=>g.classList.toggle('active',i===step));const d=steps[step];$('sideTitle').textContent=d.title;$('sideText').textContent=d.text;$('caption').textContent=d.cap;$('fact').innerHTML='<b>Clave:</b> '+d.fact;$('quote').innerHTML='<b>Idea:</b> '+d.quote;$('mathBox').classList.toggle('hidden',!d.math);$('tryBox').classList.toggle('hidden',!d.try);document.querySelectorAll('.stepBtn').forEach(b=>b.classList.toggle('active',+b.dataset.step===step));}
 function stop(){if(timer){clearTimeout(timer);timer=null;}}
 function play(){stop();setStep(0);const advance=()=>{if(step>=steps.length-1){stop();return;}timer=setTimeout(()=>{setStep(step+1);advance();},steps[step].ms||5200);};advance();}
 document.querySelectorAll('.stepBtn').forEach(b=>b.onclick=()=>{stop();setStep(+b.dataset.step)});$('play').onclick=play;$('pause').onclick=stop;$('restart').onclick=()=>{stop();setStep(0)};$('calc').onclick=()=>{const a=+$('angleInput').value,d=+$('distInput').value;if(!(a>0&&a<360&&d>0)){$('result').textContent='Introduce valores válidos.';return}$('result').textContent='≈ '+Math.round(d*360/a).toLocaleString('es-ES')+' km'};
 buildFiftieths();setStep(0);
})();
</script>
