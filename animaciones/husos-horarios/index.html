<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANAMBRO · Husos horarios</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef5f8;background:#07131d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07131d,#0b2030);min-height:100vh}.app{max-width:1100px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(18px,3vw,30px)}.badge{background:#14354a;border:1px solid #40667d;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.stage{margin:10px 0;padding:10px 12px;border-radius:11px;background:#0d2433;border:1px solid #31536a;min-height:68px;line-height:1.35}.stage b{color:#ffd56d}.viz{display:block;width:100%;aspect-ratio:16/8;background:#06111a;border:1px solid #294b61;border-radius:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.controls button{min-height:42px;padding:8px 12px;border:1px solid #55788e;border-radius:8px;background:#102b3d;color:#fff;font-weight:800}.controls .primary{background:#176c6a}.practice{margin-top:11px;padding:10px 12px;background:#0e2635;border:1px solid #31536a;border-radius:10px}.practice h2{font-size:16px;margin:0 0 7px}.practice .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.practice input,.practice select,.practice button{min-height:42px;border:1px solid #638299;border-radius:7px;background:#fff;color:#10202c;padding:7px;font-size:16px}.practice button{background:#176c6a;color:#fff;font-weight:800}.result{margin-top:7px;min-height:24px}.small{font-size:11px;color:#a8bfcb}@media(max-width:620px){.app{padding:8px}.viz{aspect-ratio:4/3}.practice .row{grid-template-columns:1fr 1fr}.controls button{flex:1}}</style></head><body><main class="app"><div class="head"><h1>🕒 Husos horarios</h1><span class="badge" id="badge"></span></div><section class="stage" id="stage"></section><svg id="svg" class="viz" viewBox="0 0 1000 520" role="img" aria-label="Animación esquemática sobre husos horarios"></svg><div class="controls"><button id="prev">◀ Anterior</button><button id="play" class="primary">▶ Explicación</button><button id="next">Siguiente ▶</button></div><section class="practice"><h2>✏️ Practica</h2><div class="row"><label>Hora de partida<input id="hour" type="time" value="12:00"></label><label>UTC origen<select id="from"><option>-5</option><option>-4</option><option>-3</option><option>-2</option><option>-1</option><option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>UTC destino<select id="to"><option>-5</option><option>-4</option><option>-3</option><option>-2</option><option>-1</option><option>0</option><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><button id="check" type="button">Calcular</button></div><div class="result" id="result"></div></section><p class="small">Primero se muestran husos teóricos de 15°. Los husos oficiales reales se adaptan a fronteras y decisiones administrativas y no siguen siempre los meridianos.</p></main><script>
(()=>{const svg=document.getElementById('svg'),stage=document.getElementById('stage'),badge=document.getElementById('badge'),NS='http://www.w3.org/2000/svg';let i=0,timer=0;const S=[['La Tierra gira','La Tierra rota de <b>oeste a este</b>. Por eso, los lugares situados más al este ven amanecer antes.'],['Greenwich: 0°','Tomamos el meridiano de <b>Greenwich</b> como referencia: longitud 0° y base del tiempo UTC.'],['360° ÷ 24 h = 15°','Una vuelta completa son 360°. Como el día se divide en 24 horas, un huso teórico ocupa <b>15° de longitud por hora</b>.'],['Este suma; oeste resta','Al desplazarnos hacia el <b>este</b> sumamos horas respecto a Greenwich; hacia el <b>oeste</b> las restamos.'],['Los husos reales se deforman','Los Estados adaptan la hora oficial a sus fronteras, economía y relaciones. El mapa real no son 24 franjas perfectas.'],['180° y cambio de fecha','Cerca del antimeridiano de Greenwich se sitúa la <b>Línea Internacional de Cambio de Fecha</b>: al cruzarla cambia el día del calendario.']];function el(n,a={}){const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);svg.appendChild(x);return x}function tx(x,y,t,sz=17,fill='#eef5f8',anchor='middle'){const e=el('text',{x,y,fill,'font-size':sz,'font-weight':'800','text-anchor':anchor});e.textContent=t;return e}function base(){svg.replaceChildren();el('rect',{x:60,y:70,width:880,height:350,rx:14,fill:'#17384d',stroke:'#658699','stroke-width':2});el('ellipse',{cx:500,cy:245,rx:370,ry:145,fill:'#2a729e','fill-opacity':.55,stroke:'#9ac4d8'});el('path',{d:'M225 205q85-80 175-15t135-10q80-45 160 15t85 95q-75 58-170 12t-145 15q-90 50-165-5t-75-107z',fill:'#4a9656','fill-opacity':.82})}function meridian(x,strong=false,c='#c9e1eb'){el('line',{x1:x,y1:93,x2:x,y2:397,stroke:c,'stroke-width':strong?4:1.4,'stroke-opacity':strong?1:.58})}function arrow(){el('path',{d:'M260 125 Q500 55 740 125',fill:'none',stroke:'#ffd45f','stroke-width':5});el('path',{d:'M734 116l20 10-19 12',fill:'#ffd45f'});tx(500,65,'rotación: oeste → este',17,'#ffd45f')}function draw(){base();const [t,p]=S[i];stage.innerHTML='<b>'+t+'</b><br>'+p;badge.textContent=(i+1)+' / '+S.length;if(i===0){arrow();tx(160,450,'OESTE',18);tx(840,450,'ESTE',18)}if(i===1){meridian(500,true,'#ffd45f');tx(500,445,'Greenwich · 0° · UTC',18,'#ffd45f')}if(i===2){for(let k=-4;k<=4;k++)meridian(500+k*92,k===0,k===0?'#ffd45f':'#b9d3df');tx(500,448,'Cada franja representa 15° ≈ 1 hora',18,'#ffd45f');for(let k=-4;k<=4;k++)tx(500+k*92,112,(k*15)+'°',11)}if(i===3){for(let k=-4;k<=4;k++){meridian(500+k*92,k===0,k===0?'#ffd45f':'#b9d3df');tx(500+k*92,112,(k>0?'+':'')+k+' h',12,k===0?'#ffd45f':'#eef5f8')}tx(755,450,'→ ESTE: sumar',16,'#ffd45f');tx(245,450,'OESTE: restar ←',16,'#ffd45f')}if(i===4){for(let k=-4;k<=4;k++)meridian(500+k*92,k===0,k===0?'#ffd45f':'#b9d3df');el('path',{d:'M250 95 C235 150 270 195 245 240 S270 335 255 395 M690 95 C720 145 680 200 710 245 S680 340 705 395',fill:'none',stroke:'#ff9d5a','stroke-width':7,'stroke-linecap':'round'});tx(500,450,'Las fronteras horarias reales no son meridianos perfectos',17,'#ffb179')}if(i===5){meridian(500,true,'#ffd45f');meridian(885,true,'#ff765d');tx(500,445,'0°',15,'#ffd45f');tx(885,445,'≈180° · cambio de fecha',15,'#ff8f7b');tx(845,105,'± 1 día',17,'#ff8f7b')} }function set(n){i=(n+S.length)%S.length;draw()}function stop(){clearInterval(timer);timer=0;document.getElementById('play').textContent='▶ Explicación'}document.getElementById('prev').onclick=()=>{stop();set(i-1)};document.getElementById('next').onclick=()=>{stop();set(i+1)};document.getElementById('play').onclick=()=>{if(timer){stop();return}document.getElementById('play').textContent='⏸ Pausar';timer=setInterval(()=>{if(i===S.length-1){stop();return}set(i+1)},2500)};document.getElementById('check').onclick=()=>{const h=document.getElementById('hour').value||'12:00',[hh,mm]=h.split(':').map(Number),a=+document.getElementById('from').value,b=+document.getElementById('to').value,delta=b-a,total=hh*60+mm+delta*60,day=total<0?-1:total>=1440?1:0,t=((total%1440)+1440)%1440,H=String(Math.floor(t/60)).padStart(2,'0'),M=String(t%60).padStart(2,'0');document.getElementById('result').innerHTML='<b>Resultado:</b> '+H+':'+M+(day===1?' · día siguiente':day===-1?' · día anterior':'')+' <span class="small">('+ (delta>=0?'+':'')+delta+' h respecto al origen)</span>'};draw()})();
</script></body></html>
