<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMBRO · Las costas: acantilados, playas y tómbolos</title>
<style>
:root{--gold:#ffd166;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef5f0;background:#0a1410}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d3a2e 0,#0a1410 55%,#030705 100%)}
.app{max-width:1300px;margin:auto;padding:12px 14px 18px}
.top h1{font-size:clamp(18px,2.6vw,28px);margin:0}.brand{font-size:12px;color:#a9c4b8;font-weight:700;letter-spacing:.04em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps button{border:1px solid #3e6656;background:#12291f;color:#e0efe8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
.steps button.on{background:#ffd166;color:#2a1d00;border-color:#ffd166}
.stage{margin:10px 0;padding:10px 14px;background:#11241c;border:1px solid #2f5646;border-radius:12px;line-height:1.45}
.stage b.t{color:var(--gold);font-size:17px}.stage p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:#06100c;border:1px solid #2a4a3c;border-radius:14px;position:relative;overflow:hidden;aspect-ratio:16/10}
.card canvas{display:block;width:100%;height:100%}
.box{background:#11241c;border:1px solid #2f5646;border-radius:12px;padding:10px 12px;line-height:1.4}
.box label{display:block;font-size:12.5px;color:#b8d4c6;font-weight:700}
.box input[type=range]{width:100%;accent-color:#ffd166}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1px solid #5a8a76;border-radius:8px;background:#12291f;color:#fff;font-weight:800;padding:6px 9px;cursor:pointer;font-size:12.5px}
.seg button.on{background:#ffd166;color:#2a1d00}
.info{min-height:44px}.info b{color:#ffd166}
#legend{font-size:12.5px;line-height:1.5}
.small{font-size:11.5px;color:#a9c4b8;margin-top:10px;line-height:1.4}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
@media(max-width:560px){.app{padding:8px}.stage{font-size:14px}.card{aspect-ratio:1/1}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div class="brand">ANAMBRO · AULA · MODELADO DEL RELIEVE</div><h1>🌊 Las costas: acantilados, playas y tómbolos</h1></div>
 <nav class="steps" id="steps"></nav>
 <section class="stage" id="stage"></section>
 <div class="grid">
  <div class="col">
   <div class="card" id="mainCard"><canvas id="main"></canvas></div>
   <div class="box info" id="info"></div>
  </div>
  <div class="col">
   <div class="box" id="optBox"><label id="optLab"></label><div class="seg" id="opt"></div></div>
   <div class="box" id="timeBox"><label id="timeLab"></label><input id="time" type="range" min="0" max="1" step="0.002" value="0"><div class="seg"><button id="play">▶ Reproducir</button><button id="reset">↺ Inicio</button></div></div>

   <div class="box"><div id="legend"></div></div>
  </div>
 </div>
 <p class="small">Perfiles, bloques diagrama y vistas en planta esquemáticos, sin escala. Ejemplos canarios: Los Gigantes, risco de Famara, Roques de Anaga y el tómbolo de La Isleta (istmo de Guanarteme).</p>
</main>
<script src="../comun/relieve.js"></script>
<script>
(()=>{
'use strict';
const R=window.AulaRelieve,$=id=>document.getElementById(id),clamp=R.clamp;
const fmt=(x,d=0)=>Number(x).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const hash=i=>{let x=Math.sin(i*127.1+3.7)*43758.5;return x-Math.floor(x)};
function fit(c){const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height,d}}
function txt(x,s,X,Y,o={}){x.save();x.font=(o.w||700)+' '+(o.s||12)+'px system-ui';x.textAlign=o.a||'center';if(o.bg){const m=x.measureText(s).width,l=o.a==='left'?X:o.a==='right'?X-m:X-m/2;x.fillStyle=o.bg;x.fillRect(l-4,Y-(o.s||12),m+8,(o.s||12)+5)}x.fillStyle=o.c||'#f2f7f4';x.fillText(s,X,Y);x.restore()}
function arrow(x,x1,y1,x2,y2,col,wd=3,hs=9){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=wd;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2+Math.cos(a)*2,y2+Math.sin(a)*2);x.lineTo(x2-Math.cos(a-.45)*hs,y2-Math.sin(a-.45)*hs);x.lineTo(x2-Math.cos(a+.45)*hs,y2-Math.sin(a+.45)*hs);x.closePath();x.fill()}
function sky(x,w,h,c1='#9cc7e6',c2='#e6f0f4'){const g=x.createLinearGradient(0,0,0,h*.6);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,w,h)}
function tag(x,s,X,Y,n){txt(x,s,X,Y,{s:n?10:12,w:800,c:'#fff',bg:'rgba(0,0,0,.55)'})}
let step=0,T=0,playing=false,tt=0,opt={},STEPS=[],DRAW={},INFO={},LEG={};
const NZ=R.noise(31);
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*clamp(t,0,1));
/* 1 · el acantilado retrocede (perfil) */
function drawCliff(x,w,h,d,t){const n=w<560;sky(x,w,h,'#8fc0e0','#eaf4f8');const sea=h*.5,base=h,top=h*.16;
 const cl0=w*.3,ret=T*w*.45,clx=cl0+ret,cyc=(T*6)%1,notch=(cyc<.8?cyc/.8:1)*w*.06,coll=cyc>=.8?(cyc-.8)/.2:0;
 const seabed=X=>X<clx?sea+h*.06+(clx-X)/w*h*.35*(X<cl0?1.6:.25):sea+h*.06;
 // roca bajo el mar (rasa) y acantilado
 x.fillStyle='#6a5846';x.beginPath();x.moveTo(0,base);for(let X=0;X<=clx;X+=6)x.lineTo(X,seabed(X));x.lineTo(clx,sea+h*.03);x.lineTo(clx+notch,sea-h*.015);x.lineTo(clx,sea-h*.06);x.lineTo(clx,top);x.lineTo(w,top);x.lineTo(w,base);x.closePath();x.save();x.clip();
 const lay=['#a08460','#8a7458','#b09070','#7a6650','#9a7e5e','#6a5846','#8a7458'];for(let i=0;i<lay.length;i++){x.fillStyle=lay[i];x.fillRect(0,top+i*(base-top)/lay.length,w,(base-top)/lay.length+1)}
 x.strokeStyle='rgba(0,0,0,.18)';for(let i=0;i<30;i++){const X=clx+hash(i)*(w-clx),Y=top+hash(i*3)*(sea-top);x.beginPath();x.moveTo(X,Y);x.lineTo(X+3,Y+14);x.stroke()}x.restore();
 x.fillStyle='#6a9a50';x.fillRect(clx,top-7,w-clx,8);
 // bloques caídos en la rasa
 for(let i=0;i<Math.floor(T*16);i++){const X=cl0+hash(i)*(ret);x.fillStyle='#7a6650';x.beginPath();x.arc(X,seabed(X)-1,3+4*hash(i*7),Math.PI,0);x.fill()}
 if(coll>0){for(let i=0;i<12;i++){const px=clx+hash(i)*w*.05-coll*w*.03,py=sea-h*.06-(1-coll)*(sea-top)*hash(i*3)*.6;x.fillStyle='#9a7e5e';x.fillRect(px,py,7+6*hash(i),6+5*hash(i*5))}txt(x,'¡derrumbe!',clx+w*.08,top+28,{s:n?12:15,w:900,c:'#c0392b',bg:'rgba(255,255,255,.85)'})}
 // agua
 x.save();x.beginPath();x.rect(0,sea,clx+notch,base-sea);x.clip();x.fillStyle='rgba(38,108,160,.5)';x.beginPath();x.moveTo(0,sea);for(let X=0;X<=clx+notch;X+=6)x.lineTo(X,sea+3*Math.sin(X*.05+t*3));x.lineTo(clx+notch,base);x.lineTo(0,base);x.fill();x.restore();
 for(let k=0;k<3;k++){const ph=(t*.3+k/3)%1,wx=ph*clx;x.strokeStyle=`rgba(255,255,255,${.85*ph})`;x.lineWidth=3;x.beginPath();x.moveTo(wx-34,sea);x.quadraticCurveTo(wx-6,sea-16*ph,wx+6,sea);x.stroke();if(ph>.88)for(let i=0;i<10;i++){x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(clx-2-hash(i+k)*16,sea-hash(i*3+k)*h*.12*(1-ph)*6,2.5,0,7);x.fill()}}
 tag(x,'acantilado',clx+(w-clx)*.5,top+34,n);tag(x,'socavón',clx+notch+40,sea-4,n);tag(x,'rasa (plataforma de abrasión)',Math.max(70,(cl0+clx)/2),sea+h*.16,n);tag(x,'olas',clx*.35,sea-22,n);
 txt(x,'el acantilado ha retrocedido unos '+fmt(Math.round(T*400/10)*10)+' m (esquema)',10,22,{a:'left',s:n?11:14,w:900,c:'#0e2a3a',bg:'rgba(255,255,255,.8)'})}
/* 2 · cabos, arcos y farallones (bloque) */
function capeZ(T){return (u,v)=>{let z=.35+.05*NZ(u*4,v*4);// tierra al fondo, mar al frente
  const coast=.42+.28*Math.exp(-Math.pow((u-.5)/.12,2))*(1-.45*T);if(v>coast)z=-.06-(v-coast)*.3;
  // cueva → arco → farallón en el extremo del cabo
  const tipV=.42+.28*(1-.45*T);const cut1=Math.abs(v-(tipV-.07));if(T>.25&&Math.abs(u-.5)<.12&&cut1<.025){const arch=T<.55;if(!arch)z=-.06}
  // farallón aislado
  if(T>.55){const st=Math.hypot((u-.5)/.045,(v-(tipV+.0))/.035);if(st<1)z=.32*(T<.85?1:1-(T-.85)/.15*.7);}
  return z}}
function drawCape(x,w,h,d,t){sky(x,w,h,'#8fc0e0','#eaf4f8');const n=w<560,q=Math.round(T*40)/40,zf=capeZ(q);const c=R.cached('cp'+q,w,h,d,cx=>R.block(cx,w,h,{z:zf,N:110,M:70,color:(u,v,z,s)=>z<.0?[200,186,140]:s>1.3?[150,130,100]:[110,140,80],water:()=>0,strata:[[0,'#a08460'],[.12,'#8a7458'],[.3,'#76624c']],v:{top:.34,hz:.3}}));x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 const tipV=.42+.28*(1-.45*q);
 if(q>.25&&q<.55){const [ax,ay]=P(.5,tipV-.07,.0);x.fillStyle='rgba(20,40,60,.85)';x.beginPath();x.ellipse(ax,ay-8,c.r.V.W*.07,14,0,Math.PI,0);x.fill();tag(x,'ARCO',ax,ay-40,n)}
 else if(q>.55){const [sx,sy]=P(.5,tipV,.3);tag(x,q<.85?'FARALLÓN (roque aislado)':'el farallón se desmorona',sx,sy-20,n)}
 else{const [sx,sy]=P(.5,tipV,.3);tag(x,q<.15?'CABO: las olas atacan sus lados':'se abren cuevas por las grietas',sx,sy-20,n)}
 for(let k=0;k<4;k++){const ph=(t*.3+k/4)%1;const [a,b]=P(.1+.8*hash(k),.98-ph*.25,.005);x.strokeStyle=`rgba(255,255,255,${.7*(1-ph)})`;x.lineWidth=2;x.beginPath();x.moveTo(a-40,b);x.lineTo(a+40,b);x.stroke()}}
/* 3 · playas, flechas y tómbolos (planta) */
function drawPlaya(x,w,h,d,t){const n=w<560,mode=opt.playa||'flecha';x.fillStyle='#2f78ac';x.fillRect(0,0,w,h);for(let i=0;i<6;i++){const ph=(t*.25+i/6)%1;x.strokeStyle=`rgba(255,255,255,${.5*(1-ph)})`;x.lineWidth=2;x.beginPath();x.moveTo(-w*.1+ph*w*.3,h*(1-ph*.55));x.lineTo(w*.9+ph*w*.3,h*(.6-ph*.55));x.stroke()}
 const land=()=>{x.fillStyle='#7fa65a';x.fillRect(0,0,w,h*.22);x.fillStyle='#e6d29a';x.fillRect(0,h*.21,w,h*.05)};
 land();
 if(mode==='flecha'){const L=w*.12+w*.55*T;x.fillStyle='#e6d29a';x.beginPath();x.moveTo(w*.2,h*.24);x.quadraticCurveTo(w*.2+L*.5,h*.3,w*.2+L,h*.34+h*.05*T);x.lineTo(w*.2+L-6,h*.37+h*.05*T);x.quadraticCurveTo(w*.2+L*.5,h*.34,w*.2,h*.28);x.fill();if(T>.4){x.fillStyle='rgba(120,150,90,.7)';x.beginPath();x.ellipse(w*.2+L*.5,h*.27,L*.35,h*.025,0,0,7);x.fill();tag(x,'albufera o marisma',w*.2+L*.5,h*.27+4,n)}tag(x,'FLECHA',w*.2+L,h*.42+h*.05*T,n)}
 else{const ix=w*.55,iy=h*.68,ir=Math.min(w,h)*.13;const L=T;x.fillStyle='#e6d29a';x.beginPath();x.moveTo(ix-ir*.6,h*.25);x.lineTo(ix+ir*.6,h*.25);x.lineTo(ix+ir*(.6-.35*L),h*.25+(iy-ir*.7-h*.25)*L);x.lineTo(ix-ir*(.6-.35*L),h*.25+(iy-ir*.7-h*.25)*L);x.fill();x.fillStyle='#8a6e52';x.beginPath();for(let i=0;i<=24;i++){const a=i/24*6.283,r=ir*(1+.1*Math.sin(a*5));x.lineTo(ix+r*Math.cos(a),iy+r*Math.sin(a)*.85)}x.fill();tag(x,'isla',ix,iy+4,n);if(L>.95)tag(x,'TÓMBOLO: la isla queda unida a tierra',ix,h*.47,n);else tag(x,'la arena se acumula al abrigo de la isla',ix,h*.47,n)}
 // deriva litoral: granos en zigzag
 for(let i=0;i<14;i++){const ph=(t*.3+i/14)%1,px=w*.05+ph*w*.9,zz=Math.abs(((ph*12)%2)-1);x.fillStyle='#fff3c0';x.beginPath();x.arc(px,h*.255+zz*h*.03,2.6,0,7);x.fill()}
 arrow(x,w*.1,h*.12,w*.45,h*.12,'#163024',3,10);txt(x,'deriva litoral: las olas mueven la arena a lo largo de la costa',w*.1,h*.09,{a:'left',s:n?10:12,w:800,c:'#163024'});txt(x,'vista desde arriba',w-10,h-10,{a:'right',s:n?10:12,w:800,c:'#fff'})}
STEPS=[
 {k:'Acantilados',v:'cliff',time:'Tiempo',dur:18,t:'Cómo retrocede un acantilado',p:'Las olas golpean la base del acantilado con agua, arena y piedras, y la van desgastando: se forma un <b>socavón</b> o muesca. Cuando la roca de encima se queda sin apoyo, se <b>derrumba</b>. El mar retira los bloques caídos y el ciclo vuelve a empezar. Así el acantilado <b>retrocede</b> tierra adentro y deja delante una plataforma rocosa casi llana: la <b>rasa</b> o plataforma de abrasión. Pulsa ▶.'},
 {k:'Cabos, arcos y roques',v:'cape',time:'Tiempo',dur:18,t:'Cabos, arcos y farallones',p:'Las olas concentran su energía en los <b>cabos</b>, que sobresalen hacia el mar. Primero abren <b>cuevas</b> aprovechando las grietas; si dos cuevas se unen a través del cabo se forma un <b>arco</b>; cuando el techo del arco se hunde, queda un roque aislado en el mar: un <b>farallón</b>, que con el tiempo también desaparecerá. Pulsa ▶.'},
 {k:'Playas, flechas y tómbolos',v:'playa',time:'Tiempo',dur:16,resetT:true,o:[['flecha','Flecha'],['tombolo','Tómbolo']],ol:'Forma',t:'Las costas que crecen: playas, flechas y tómbolos',p:'Las olas no solo destruyen: también transportan arena. Cuando llegan inclinadas a la costa, empujan los granos en zigzag a lo largo de la playa: es la <b>deriva litoral</b>. Donde la costa cambia de dirección, la arena sigue avanzando mar adentro y forma una <b>flecha</b>, que puede cerrar una albufera. Si una isla está cerca de la costa, la arena se acumula a su abrigo hasta unirla a tierra: es un <b>tómbolo</b>.'}];
DRAW={cliff:drawCliff,cape:drawCape,playa:drawPlaya};
INFO={cliff:()=>'En Canarias hay acantilados espectaculares: <b>Los Gigantes</b> (Tenerife), el risco de <b>Famara</b> (Lanzarote), el norte de La Gomera y el oeste de Gran Canaria. En la costa norte de las islas se ven rasas que quedan al descubierto con la marea baja.',cape:()=>'Ejemplos: los <b>Roques de Anaga</b> (Tenerife) son farallones; en la costa de Lanzarote y de La Gomera hay arcos y cuevas marinas. En el Cantábrico, la playa de las Catedrales (Lugo) tiene arcos famosos.',playa:()=>opt.playa==='tombolo'?'<b>La Isleta</b> (Gran Canaria) era una isla y quedó unida a Gran Canaria por un tómbolo de arena: el istmo de Guanarteme, donde hoy está parte de Las Palmas de Gran Canaria, entre las playas de Las Canteras y de Las Alcaravaneras. El peñón de Gibraltar también es un tómbolo.':'Ejemplos de flechas: La Manga del Mar Menor (Murcia), que cierra una albufera, y la punta del Fangar en el delta del Ebro.'};
LEG={cliff:'Perfil del acantilado (esquema sin escala).',cape:'Bloque diagrama: tierra al fondo, mar delante.',playa:'Vista en planta: tierra (verde), playa (amarillo) y mar.'};

function renderSteps(){$('steps').innerHTML=STEPS.map((s,i)=>`<button class="${i===step?'on':''}" data-i="${i}">${i+1} · ${s.k}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function renderOpt(){const s=STEPS[step];if(!s.o){$('optBox').style.display='none';return}$('optBox').style.display='';$('optLab').textContent=s.ol;if(opt[s.v]==null)opt[s.v]=s.o[0][0];$('opt').innerHTML=s.o.map(([k,n])=>`<button data-k="${k}" class="${opt[s.v]===k?'on':''}">${n}</button>`).join('');$('opt').querySelectorAll('button').forEach(b=>b.onclick=()=>{opt[s.v]=b.dataset.k;if(s.resetT)T=0;renderOpt();info();legend()})}
function legend(){const v=STEPS[step].v;$('legend').innerHTML=typeof LEG[v]==='function'?LEG[v]():(LEG[v]||'')}
function info(){const v=STEPS[step].v;$('info').innerHTML=INFO[v]?INFO[v]():''}
function go(i){step=i;const s=STEPS[i];$('stage').innerHTML=`<b class="t">${s.t}</b><p>${s.p}</p>`;renderSteps();renderOpt();$('timeBox').style.display=s.time?'':'none';if(s.time)$('timeLab').innerHTML=s.time;T=s.t0??0;playing=!!s.autoplay;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir';document.querySelectorAll('[data-show]').forEach(el=>el.style.display=el.dataset.show.split(' ').includes(s.v)?'':'none');legend();info()}
$('time').oninput=()=>{T=+$('time').value;playing=false;$('play').textContent='▶ Reproducir';info()};
$('play').onclick=()=>{if(T>=1)T=0;playing=!playing;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir'};
$('reset').onclick=()=>{T=0;info()};
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;const s=STEPS[step];if(playing&&s.time){T=Math.min(1,T+dt/(s.dur||14));if(T>=1){if(s.loop)T=0;else{playing=false;$('play').textContent='▶ Reproducir'}}acc+=dt;if(acc>.3){acc=0;info()}}$('time').value=T;
 const {x,w,h,d}=fit($('main'));DRAW[s.v](x,w,h,d,tt);requestAnimationFrame(frame)}
renderSteps();go(0);requestAnimationFrame(frame);
window.__g={go,set T(v){T=v;info()},set opt(v){opt[STEPS[step].v]=v;renderOpt();info();legend()}};
})();
</script>
</body>
</html>
