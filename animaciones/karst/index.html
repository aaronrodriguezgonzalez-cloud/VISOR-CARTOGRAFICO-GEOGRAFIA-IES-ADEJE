<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMBRO · El relieve kárstico: dolinas y cuevas</title>
<style>
:root{--gold:#ffd166;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef5f0;background:#0a1410}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d3a2e 0,#0a1410 55%,#030705 100%)}
.app{max-width:1300px;margin:auto;padding:12px 14px 18px}
.top h1{font-size:clamp(18px,2.6vw,28px);margin:0}.brand{font-size:12px;color:#a9c4b8;font-weight:700;letter-spacing:.04em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps button{border:1px solid #3e6656;background:#12291f;color:#e0efe8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
.steps button.on{background:#ffd166;color:#2a1d00;border-color:#ffd166}
.stage{margin:10px 0;padding:10px 14px;background:#11241c;border:1px solid #2f5646;border-radius:12px;line-height:1.45}
.stage b.t{color:var(--gold);font-size:17px}.stage p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:#06100c;border:1px solid #2a4a3c;border-radius:14px;position:relative;overflow:hidden;aspect-ratio:16/10}
.card canvas{display:block;width:100%;height:100%}
.box{background:#11241c;border:1px solid #2f5646;border-radius:12px;padding:10px 12px;line-height:1.4}
.box label{display:block;font-size:12.5px;color:#b8d4c6;font-weight:700}
.box input[type=range]{width:100%;accent-color:#ffd166}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1px solid #5a8a76;border-radius:8px;background:#12291f;color:#fff;font-weight:800;padding:6px 9px;cursor:pointer;font-size:12.5px}
.seg button.on{background:#ffd166;color:#2a1d00}
.info{min-height:44px}.info b{color:#ffd166}
#legend{font-size:12.5px;line-height:1.5}
.small{font-size:11.5px;color:#a9c4b8;margin-top:10px;line-height:1.4}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
@media(max-width:560px){.app{padding:8px}.stage{font-size:14px}.card{aspect-ratio:1/1}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div class="brand">ANAMBRO · AULA · MODELADO DEL RELIEVE</div><h1>🕳️ El relieve kárstico: dolinas y cuevas</h1></div>
 <nav class="steps" id="steps"></nav>
 <section class="stage" id="stage"></section>
 <div class="grid">
  <div class="col">
   <div class="card" id="mainCard"><canvas id="main"></canvas></div>
   <div class="box info" id="info"></div>
  </div>
  <div class="col">
   <div class="box" id="optBox"><label id="optLab"></label><div class="seg" id="opt"></div></div>
   <div class="box" id="timeBox"><label id="timeLab"></label><input id="time" type="range" min="0" max="1" step="0.002" value="0"><div class="seg"><button id="play">▶ Reproducir</button><button id="reset">↺ Inicio</button></div></div>

   <div class="box"><div id="legend"></div></div>
  </div>
 </div>
 <p class="small">Esquemas sin escala. Ejemplos: Torcal de Antequera, Ciudad Encantada, Picos de Europa, Cueva de Nerja, El Soplao.</p>
</main>
<script src="../comun/relieve.js"></script>
<script>
(()=>{
'use strict';
const R=window.AulaRelieve,$=id=>document.getElementById(id),clamp=R.clamp;
const fmt=(x,d=0)=>Number(x).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const hash=i=>{let x=Math.sin(i*127.1+3.7)*43758.5;return x-Math.floor(x)};
function fit(c){const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height,d}}
function txt(x,s,X,Y,o={}){x.save();x.font=(o.w||700)+' '+(o.s||12)+'px system-ui';x.textAlign=o.a||'center';if(o.bg){const m=x.measureText(s).width,l=o.a==='left'?X:o.a==='right'?X-m:X-m/2;x.fillStyle=o.bg;x.fillRect(l-4,Y-(o.s||12),m+8,(o.s||12)+5)}x.fillStyle=o.c||'#f2f7f4';x.fillText(s,X,Y);x.restore()}
function arrow(x,x1,y1,x2,y2,col,wd=3,hs=9){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=wd;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2+Math.cos(a)*2,y2+Math.sin(a)*2);x.lineTo(x2-Math.cos(a-.45)*hs,y2-Math.sin(a-.45)*hs);x.lineTo(x2-Math.cos(a+.45)*hs,y2-Math.sin(a+.45)*hs);x.closePath();x.fill()}
function sky(x,w,h,c1='#9cc7e6',c2='#e6f0f4'){const g=x.createLinearGradient(0,0,0,h*.6);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,w,h)}
function tag(x,s,X,Y,n){txt(x,s,X,Y,{s:n?10:12,w:800,c:'#fff',bg:'rgba(0,0,0,.55)'})}
let step=0,T=0,playing=false,tt=0,opt={},STEPS=[],DRAW={},INFO={},LEG={};
const NZ=R.noise(41);
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*clamp(t,0,1));
/* 1 · la disolución */
function drawDis(x,w,h,d,t){const n=w<560;sky(x,w,h,'#7f9fb8','#dde8ee');const gy=h*.42;
 const g=x.createLinearGradient(0,gy,0,h);g.addColorStop(0,'#d8d2c2');g.addColorStop(1,'#a8a090');x.fillStyle=g;x.fillRect(0,gy,w,h-gy);
 // diaclasas que se ensanchan
 for(let k=0;k<7;k++){const X=w*(.08+k*.14),wd=2+T*14*(1-k%2*.4);x.fillStyle='#6a6458';x.beginPath();x.moveTo(X-wd,gy);x.lineTo(X+wd,gy);x.lineTo(X+wd*.3,h);x.lineTo(X-wd*.3,h);x.fill()}
 x.strokeStyle='rgba(90,85,75,.5)';for(let k=1;k<5;k++){x.beginPath();x.moveTo(0,gy+k*(h-gy)/5);x.lineTo(w,gy+k*(h-gy)/5);x.stroke()}
 // lluvia con CO2
 for(let i=0;i<70;i++){const ph=(t*.6+i/70)%1,px=hash(i)*w,py=ph*gy;x.strokeStyle='rgba(60,100,160,.6)';x.beginPath();x.moveTo(px,py);x.lineTo(px-2,py+8);x.stroke()}
 for(let i=0;i<30;i++){const ph=(t*.2+i/30)%1,k=i%7,X=w*(.08+k*.14),py=gy+ph*(h-gy);x.fillStyle='rgba(60,110,170,.8)';x.beginPath();x.arc(X+Math.sin(i)*2,py,2.5,0,7);x.fill()}
 txt(x,'agua + CO₂ → agua ligeramente ácida',w/2,h*.12,{s:n?13:17,w:900,c:'#0e2236',bg:'rgba(255,255,255,.8)'});txt(x,'que disuelve la caliza (carbonato cálcico) por las grietas',w/2,h*.12+(n?18:24),{s:n?10.5:13,w:800,c:'#0e2236',bg:'rgba(255,255,255,.8)'});
 tag(x,'diaclasas (grietas) que se ensanchan',w*.5,gy+(h-gy)*.5,n)}
/* 2 · paisaje kárstico (bloque) */
function kZ(T){return (u,v)=>{let z=.5+.03*NZ(u*5,v*5);const pits=[[.3,.3,.07],[.62,.25,.06],[.45,.55,.09],[.75,.6,.05],[.2,.7,.06]];for(const [pu,pv,r] of pits){const dd=Math.hypot(u-pu,v-pv),rr=r*(.3+.7*T);if(dd<rr)z-=.18*T*(1-Math.pow(dd/rr,2))}
  // poljé
  const pj=Math.hypot((u-.78)/.16,(v-.25)/.12);if(pj<1)z=Math.min(z,.5-.2*T+.0*(pj));
  // lapiaz: surcos finos
  if(u<.25&&v<.4)z-=.015*T*Math.pow(Math.abs(Math.sin(u*160)),6);
  return z}}
function drawKarst(x,w,h,d,t){sky(x,w,h);const n=w<560,q=Math.round(T*30)/30,zf=kZ(q);const c=R.cached('k'+q,w,h,d,cx=>R.block(cx,w,h,{z:zf,N:110,M:70,color:(u,v,z,s)=>{if(Math.hypot((u-.78)/.16,(v-.25)/.12)<1&&q>.3)return [130,150,80];if(s>1.2)return [190,184,170];return mix([200,196,184],[150,160,120],clamp(NZ(u*8,v*8)+.3,0,1))},strata:[[0,'#cfc8b6'],[.1,'#bdb5a2'],[.22,'#d6cfbd'],[.36,'#b2aa98'],[.5,'#c6bfac']],base:-.3,v:{top:.36,hz:.36},sideExtra:(cx,P,front)=>{if(!front)return;// cueva en el corte frontal
   const g0=P(.35,1,.12-.0),cw=(P(.75,1,0)[0]-P(.35,1,0)[0]);cx.fillStyle='#2a2622';cx.beginPath();cx.ellipse(g0[0]+cw/2,g0[1]+16,cw/2*(.3+.7*q),22*(.4+.6*q),0,0,7);cx.fill();
   // estalactitas y estalagmitas
   cx.fillStyle='#e8e0cc';for(let i=0;i<9;i++){const X=g0[0]+cw*(.15+.7*i/8),Ltop=8*q*(1+hash(i)),Lb=6*q*(1+hash(i+4));cx.beginPath();cx.moveTo(X-3,g0[1]+16-22*(.4+.6*q)+4);cx.lineTo(X+3,g0[1]+16-22*(.4+.6*q)+4);cx.lineTo(X,g0[1]+16-22*(.4+.6*q)+4+Ltop);cx.fill();cx.beginPath();cx.moveTo(X-3+4,g0[1]+16+22*(.4+.6*q)-3);cx.lineTo(X+3+4,g0[1]+16+22*(.4+.6*q)-3);cx.lineTo(X+4,g0[1]+16+22*(.4+.6*q)-3-Lb);cx.fill()}
   // río subterráneo
   cx.fillStyle='rgba(50,110,160,.9)';cx.fillRect(g0[0]+cw*.1,g0[1]+16+22*(.4+.6*q)-4,cw*.8,4)}}));
 x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 for(let i=0;i<10;i++){const ph=(t*.25+i/10)%1,[a,b]=P(.45,.55,zf(.45,.55)+.02-ph*.3);x.fillStyle='rgba(60,110,170,.8)';x.beginPath();x.arc(a,b,2.4,0,7);x.fill()}
 if(q>.3){const L=[['dolina',.45,.55,.03],['dolina',.3,.3,.03],['poljé',.78,.25,.03],['lapiaz',.12,.2,.06],['cueva',.55,1,-.08]];for(const [s,u,v,dz] of L){const [px,py]=P(u,v,zf(u,v)+dz);tag(x,s,px,py,n)}}
 txt(x,q<.3?'roca caliza recién expuesta':'paisaje kárstico',10,22,{a:'left',s:n?12:15,w:900,c:'#0e2236',bg:'rgba(255,255,255,.8)'})}
/* 3 · estalactitas */
function drawCueva(x,w,h,d,t){const n=w<560;x.fillStyle='#1a1612';x.fillRect(0,0,w,h);const g=x.createRadialGradient(w*.5,h*.5,10,w*.5,h*.5,w*.6);g.addColorStop(0,'rgba(255,220,160,.18)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle='#3a332b';x.beginPath();x.moveTo(0,0);x.lineTo(w,0);x.lineTo(w,h*.12);for(let X=w;X>=0;X-=10)x.lineTo(X,h*.12+h*.03*Math.sin(X*.05));x.fill();x.fillRect(0,h*.9,w,h*.1);
 const L=T;for(let i=0;i<9;i++){const X=w*(.08+i*.105),lt=h*(.1+.3*L)*(.5+.5*hash(i)),lb=h*(.06+.22*L)*(.5+.5*hash(i+5)),gap=h*.78-lt-lb;
  const gr=x.createLinearGradient(X-8,0,X+8,0);gr.addColorStop(0,'#b8a888');gr.addColorStop(.5,'#efe4c8');gr.addColorStop(1,'#a89878');x.fillStyle=gr;
  if(gap>0){x.beginPath();x.moveTo(X-10,h*.12);x.lineTo(X+10,h*.12);x.lineTo(X,h*.12+lt);x.fill();x.beginPath();x.moveTo(X-14,h*.9);x.lineTo(X+14,h*.9);x.lineTo(X+3,h*.9-lb);x.lineTo(X-3,h*.9-lb);x.fill();
   const ph=(t*.7+hash(i))%1;x.fillStyle='rgba(160,200,255,.9)';x.beginPath();x.arc(X,h*.12+lt+ph*gap,2.2,0,7);x.fill()}
  else{x.beginPath();x.moveTo(X-12,h*.12);x.lineTo(X+12,h*.12);x.lineTo(X+9,h*.9);x.lineTo(X-9,h*.9);x.fill();if(i===4)tag(x,'columna',X,h*.5,n)}}
 tag(x,'estalactita (cuelga del techo)',w*.25,h*.3,n);tag(x,'estalagmita (crece desde el suelo)',w*.62,h*.8,n);
 txt(x,'tiempo: '+fmt(T*100000)+' años (crecen pocos milímetros por siglo)',10,22,{a:'left',s:n?11:14,w:900,c:'#ffd166',bg:'rgba(0,0,0,.5)'})}
STEPS=[
 {k:'Disolución',v:'dis',time:'Tiempo',dur:12,t:'El agua que disuelve la roca',p:'El agua de lluvia absorbe <b>dióxido de carbono</b> del aire y del suelo y se vuelve ligeramente ácida. Al filtrarse por las grietas (<b>diaclasas</b>) de rocas como la <b>caliza</b> o el yeso, las va <b>disolviendo</b> poco a poco, como el agua disuelve el azúcar. Así las grietas se ensanchan durante miles de años. A este modelado se le llama <b>kárstico</b>.'},
 {k:'Paisaje kárstico',v:'karst',time:'Tiempo',dur:16,t:'Formas del relieve kárstico',p:'En la superficie, la disolución forma <b>lapiaces</b> (surcos y crestas afiladas en la roca), <b>dolinas</b> (hoyos redondeados por donde el agua se hunde) y <b>poljés</b> (grandes depresiones de fondo plano). Bajo tierra, el agua abre <b>simas</b>, <b>cuevas</b> y <b>ríos subterráneos</b> que reaparecen en manantiales. Pulsa ▶.'},
 {k:'Estalactitas',v:'cueva',time:'Tiempo',dur:16,t:'Estalactitas y estalagmitas',p:'Dentro de las cuevas ocurre lo contrario: el agua que gotea del techo pierde CO₂ al llegar al aire de la cueva y <b>deposita</b> la caliza que llevaba disuelta. Gota a gota crecen las <b>estalactitas</b>, que cuelgan del techo, y debajo las <b>estalagmitas</b>, que suben desde el suelo. Si se unen forman una <b>columna</b>. Crecen muy despacio: pocos milímetros por siglo.'}];
DRAW={dis:drawDis,karst:drawKarst,cueva:drawCueva};
INFO={dis:()=>'Rocas solubles: caliza, dolomía y yeso. En Canarias, donde casi todas las rocas son volcánicas, apenas hay relieve kárstico.',karst:()=>'Ejemplos en España: el <b>Torcal de Antequera</b> (Málaga, lapiaz), la <b>Ciudad Encantada</b> (Cuenca), los <b>Picos de Europa</b> con simas de más de 1.000 m, el polje de Zafarraya (Granada).',cueva:()=>'Cuevas visitables: la <b>Cueva de Nerja</b> (Málaga), <b>El Soplao</b> (Cantabria), las Cuevas del Drach (Mallorca). Una estalactita rota tarda miles de años en volver a crecer: hay que protegerlas.'};
LEG={dis:'Las gotas azules son el agua que se infiltra por las grietas.',karst:'En el corte frontal se ve una cueva con su río subterráneo.',cueva:'Gotas de agua (azul) depositando caliza.'};

function renderSteps(){$('steps').innerHTML=STEPS.map((s,i)=>`<button class="${i===step?'on':''}" data-i="${i}">${i+1} · ${s.k}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function renderOpt(){const s=STEPS[step];if(!s.o){$('optBox').style.display='none';return}$('optBox').style.display='';$('optLab').textContent=s.ol;if(opt[s.v]==null)opt[s.v]=s.o[0][0];$('opt').innerHTML=s.o.map(([k,n])=>`<button data-k="${k}" class="${opt[s.v]===k?'on':''}">${n}</button>`).join('');$('opt').querySelectorAll('button').forEach(b=>b.onclick=()=>{opt[s.v]=b.dataset.k;if(s.resetT){T=0;if(s.time){playing=true;$('play').textContent='⏸ Pausa'}}renderOpt();info();legend()})}
function legend(){const v=STEPS[step].v;$('legend').innerHTML=typeof LEG[v]==='function'?LEG[v]():(LEG[v]||'')}
function info(){const v=STEPS[step].v;$('info').innerHTML=INFO[v]?INFO[v]():''}
function go(i){step=i;const s=STEPS[i];$('stage').innerHTML=`<b class="t">${s.t}</b><p>${s.p}</p>`;renderSteps();renderOpt();$('timeBox').style.display=s.time?'':'none';if(s.time)$('timeLab').innerHTML=s.time;T=s.t0??0;playing=s.autoplay!==false&&!!s.time;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir';document.querySelectorAll('[data-show]').forEach(el=>el.style.display=el.dataset.show.split(' ').includes(s.v)?'':'none');legend();info()}
$('time').oninput=()=>{T=+$('time').value;playing=false;$('play').textContent='▶ Reproducir';info()};
$('play').onclick=()=>{if(T>=1)T=0;playing=!playing;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir'};
$('reset').onclick=()=>{T=0;info()};
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;const s=STEPS[step];if(playing&&s.time){T=Math.min(1,T+dt/(s.dur||14));if(T>=1){if(s.loop)T=0;else{playing=false;$('play').textContent='▶ Reproducir'}}acc+=dt;if(acc>.3){acc=0;info()}}$('time').value=T;
 const {x,w,h,d}=fit($('main'));DRAW[s.v](x,w,h,d,tt);requestAnimationFrame(frame)}
renderSteps();go(0);requestAnimationFrame(frame);
window.__g={go,set play(v){playing=v},set T(v){T=v;info()},set opt(v){opt[STEPS[step].v]=v;renderOpt();info();legend()}};
})();
</script>
</body>
</html>
