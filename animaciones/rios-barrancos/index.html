<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANAMBRO · Ríos, barrancos, deltas y estuarios</title>
<style>
:root{--gold:#ffd166;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef5f0;background:#0a1410}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d3a2e 0,#0a1410 55%,#030705 100%)}
.app{max-width:1300px;margin:auto;padding:12px 14px 18px}
.top h1{font-size:clamp(18px,2.6vw,28px);margin:0}.brand{font-size:12px;color:#a9c4b8;font-weight:700;letter-spacing:.04em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps button{border:1px solid #3e6656;background:#12291f;color:#e0efe8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
.steps button.on{background:#ffd166;color:#2a1d00;border-color:#ffd166}
.stage{margin:10px 0;padding:10px 14px;background:#11241c;border:1px solid #2f5646;border-radius:12px;line-height:1.45}
.stage b.t{color:var(--gold);font-size:17px}.stage p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:#06100c;border:1px solid #2a4a3c;border-radius:14px;position:relative;overflow:hidden;aspect-ratio:16/10}
.card canvas{display:block;width:100%;height:100%}
.box{background:#11241c;border:1px solid #2f5646;border-radius:12px;padding:10px 12px;line-height:1.4}
.box label{display:block;font-size:12.5px;color:#b8d4c6;font-weight:700}
.box input[type=range]{width:100%;accent-color:#ffd166}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1px solid #5a8a76;border-radius:8px;background:#12291f;color:#fff;font-weight:800;padding:6px 9px;cursor:pointer;font-size:12.5px}
.seg button.on{background:#ffd166;color:#2a1d00}
.info{min-height:44px}.info b{color:#ffd166}
#legend{font-size:12.5px;line-height:1.5}
.small{font-size:11.5px;color:#a9c4b8;margin-top:10px;line-height:1.4}
@media(max-width:940px){.grid{grid-template-columns:1fr}}
@media(max-width:560px){.app{padding:8px}.stage{font-size:14px}.card{aspect-ratio:1/1}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div class="brand">ANAMBRO · AULA · MODELADO DEL RELIEVE</div><h1>🏞️ Ríos, barrancos, deltas y estuarios</h1></div>
 <nav class="steps" id="steps"></nav>
 <section class="stage" id="stage"></section>
 <div class="grid">
  <div class="col">
   <div class="card" id="mainCard"><canvas id="main"></canvas></div>
   <div class="box info" id="info"></div>
  </div>
  <div class="col">
   <div class="box" id="optBox"><label id="optLab"></label><div class="seg" id="opt"></div></div>
   <div class="box" id="timeBox"><label id="timeLab"></label><input id="time" type="range" min="0" max="1" step="0.002" value="0"><div class="seg"><button id="play">▶ Reproducir</button><button id="reset">↺ Inicio</button></div></div>

   <div class="box"><div id="legend"></div></div>
  </div>
 </div>
 <p class="small">Bloques diagrama y vistas en planta esquemáticos, sin escala, generados en el navegador. Ejemplos citados: delta del Ebro, estuarios del Tajo y del Guadalquivir, barrancos de Tenerife, Gran Canaria y La Palma.</p>
</main>
<script src="../comun/relieve.js"></script>
<script>
(()=>{
'use strict';
const R=window.AulaRelieve,$=id=>document.getElementById(id),clamp=R.clamp;
const fmt=(x,d=0)=>Number(x).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const hash=i=>{let x=Math.sin(i*127.1+3.7)*43758.5;return x-Math.floor(x)};
function fit(c){const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height,d}}
function txt(x,s,X,Y,o={}){x.save();x.font=(o.w||700)+' '+(o.s||12)+'px system-ui';x.textAlign=o.a||'center';if(o.bg){const m=x.measureText(s).width,l=o.a==='left'?X:o.a==='right'?X-m:X-m/2;x.fillStyle=o.bg;x.fillRect(l-4,Y-(o.s||12),m+8,(o.s||12)+5)}x.fillStyle=o.c||'#f2f7f4';x.fillText(s,X,Y);x.restore()}
function arrow(x,x1,y1,x2,y2,col,wd=3,hs=9){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=wd;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2+Math.cos(a)*2,y2+Math.sin(a)*2);x.lineTo(x2-Math.cos(a-.45)*hs,y2-Math.sin(a-.45)*hs);x.lineTo(x2-Math.cos(a+.45)*hs,y2-Math.sin(a+.45)*hs);x.closePath();x.fill()}
function sky(x,w,h,c1='#9cc7e6',c2='#e6f0f4'){const g=x.createLinearGradient(0,0,0,h*.6);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,w,h)}
function tag(x,s,X,Y,n){txt(x,s,X,Y,{s:n?10:12,w:800,c:'#fff',bg:'rgba(0,0,0,.55)'})}
let step=0,T=0,playing=false,tt=0,opt={},STEPS=[],DRAW={},INFO={},LEG={};
const NZ=R.noise(7),NZ2=R.noise(11);
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*clamp(t,0,1));
function landColor(z,slope,o={}){const sea=o.sea??0;if(z<sea+.02)return [212,196,150];if(z>.78)return mix([150,140,130],[245,248,250],(z-.78)/.08);if(slope>.9)return [128,112,96];return mix([96,140,70],[120,110,80],clamp((z-.15)/.6,0,1))}
/* ---------- 1 · un río de la montaña al mar ---------- */
const rx=v=>.5+.07*Math.sin(v*5)+.1*Math.pow(v,2)*Math.sin(v*16);
function riverZ(u,v){const sea=v>.88;let E=.9*Math.pow(1-v,1.5)+.06;E+=(1-v)*.25*NZ(u*4,v*4);const d=Math.abs(u-rx(v)),wv=.035+.3*Math.pow(v,1.6),dep=.42*Math.pow(1-v,1.1)+.02;let cut=d<wv?dep*Math.pow(1-d/wv,v<.4?1:2.2):0;let z=E-cut;if(v>.82)z=Math.min(z,.06-(v-.82)*.9);if(v>.86)z=Math.min(z,-.04-(v-.86)*.6);return z}
const riverW=v=>.006+.02*v;
function drawTramos(x,w,h,d,t){sky(x,w,h);const n=w<560;const c=R.cached('tramos',w,h,d,cx=>R.block(cx,w,h,{z:riverZ,color:(u,v,z,s)=>landColor(z,s),water:(u,v)=>{if(v>.86)return 0;const dd=Math.abs(u-rx(v));return dd<riverW(v)?riverZ(rx(v),v)+.012:null},v:{top:.3,hz:.26}}));x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 for(let i=0;i<60;i++){const ph=(t*.05+i/60)%1,v=ph*.9,u=rx(v)+(hash(i)-.5)*riverW(v),[px,py]=P(u,v,riverZ(rx(v),v)+.02);const sz=v<.33?3.2:v<.66?2.2:1.3;x.fillStyle=v<.33?'#6a5a4a':v<.66?'#9a8060':'#d0b890';x.beginPath();x.arc(px,py,sz,0,7);x.fill()}
 const L=[[.15,'CURSO ALTO · erosión','#ff9a6b'],[.5,'CURSO MEDIO · transporte','#ffd166'],[.8,'CURSO BAJO · sedimentación','#9fe6a0']];for(const [v,s,c2] of L){const [px,py]=P(rx(v)+.12,v,riverZ(rx(v),v)+.1);txt(x,s,px,py,{a:'left',s:n?10:12.5,w:900,c:c2,bg:'rgba(0,0,0,.6)'})}
 const [mx,my]=P(rx(.88),.9,0);tag(x,'desembocadura',mx,my+18,n);const [sx,sy]=P(rx(.02),.02,riverZ(rx(.02),.02));tag(x,'nacimiento',sx,sy-10,n)}
/* ---------- 2 · valle en V ---------- */
function vZ(T){return (u,v)=>{const base=.5+.05*NZ(u*3,v*3),cxv=.5+.04*Math.sin(v*6),dd=Math.abs(u-cxv),D=.03+.5*T,W=.04+.36*T;const cut=dd<W?D*Math.pow(1-dd/W,1.15):0;return base-cut}}
function drawValleV(x,w,h,d,t){sky(x,w,h);const n=w<560,q=Math.round(T*40)/40;const c=R.cached('vv'+q,w,h,d,cx=>R.block(cx,w,h,{z:vZ(q),N:96,M:56,color:(u,v,z,s)=>s>1.3?[140,118,96]:[98,138,74],water:(u,v)=>{const cxv=.5+.04*Math.sin(v*6);return Math.abs(u-cxv)<.012?vZ(q)(cxv,v)+.012:null},strata:[[0,'#8a7258'],[.12,'#a08460'],[.24,'#6e5a46'],[.38,'#8a6e52'],[.55,'#5a4a3c']],v:{top:.24,hz:.42}}));x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 // desprendimientos en las laderas
 for(let i=0;i<10;i++){const ph=(t*.4+i/10)%1,side=i%2?1:-1,cxv=.5+.04*Math.sin(.9*6),W=.04+.36*q,u=cxv+side*W*(1-ph)*.8,z=vZ(q)(u,.9);const [px,py]=P(u,.9,z+.01);x.fillStyle='rgba(110,90,70,.9)';x.beginPath();x.arc(px,py,2.5,0,7);x.fill()}
 const [ax,ay]=P(.5,1,vZ(q)(.5,1));tag(x,q<.15?'el río empieza a encajarse':'perfil en V',ax,ay+22,n);txt(x,'tiempo: '+fmt(T*2,1)+' millones de años (aprox.)',10,22,{a:'left',s:n?12:15,w:900,c:'#163024',bg:'rgba(255,255,255,.7)'})}
/* ---------- 3 · meandros ---------- */
function meanderPts(w0,w,h){const pts=[];let X=0,Y=h*.55,th=0;const L=w*1.7,N=500,ds=L/N;for(let i=0;i<=N;i++){const s=i/N;const env=Math.exp(-Math.pow((s-.5)/.22,2));const om=.25+w0*env;th=om*Math.sin(2*Math.PI*(s-.5)*2.2);X+=Math.cos(th)*ds;Y+=Math.sin(th)*ds;pts.push([X,Y])}const sx=w/2-pts[Math.floor(N/2)][0],sy=h*.55-pts[Math.floor(N/2)][1];return pts.map(p=>[p[0]+sx,p[1]+sy])}
function drawMeandros(x,w,h,d,t){const n=w<560;x.fillStyle='#7fa65a';x.fillRect(0,0,w,h);for(let i=0;i<300;i++){x.fillStyle=`rgba(60,100,40,${.25*hash(i)})`;x.beginPath();x.arc(hash(i*3)*w,hash(i*7)*h,3+6*hash(i),0,7);x.fill()}
 const cut=T>.82;const B=.3+1.9*Math.min(T,.82)/.82;const pts=meanderPts(B,w,h);
 const path=(ps,wd,col)=>{x.strokeStyle=col;x.lineWidth=wd;x.lineCap='round';x.lineJoin='round';x.beginPath();ps.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke()};
 if(!cut){// barras de arena en la orilla convexa y erosión en la cóncava
  for(let i=3;i<pts.length-3;i+=4){const [a,b,c]=[pts[i-2],pts[i],pts[i+2]];const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(cr)<3)continue;const nx=-(c[1]-a[1]),ny=c[0]-a[0],nl=Math.hypot(nx,ny)||1,sg=Math.sign(cr);x.fillStyle='rgba(225,205,150,.95)';x.beginPath();x.arc(b[0]+sg*nx/nl*14,b[1]+sg*ny/nl*14,7,0,7);x.fill();x.strokeStyle='rgba(200,60,40,.9)';x.lineWidth=2;x.beginPath();x.moveTo(b[0]-sg*nx/nl*12,b[1]-sg*ny/nl*12);x.lineTo(b[0]-sg*nx/nl*19,b[1]-sg*ny/nl*19);x.stroke()}
  path(pts,n?14:20,'#3d7fb0');x.setLineDash([6,14]);x.lineDashOffset=-t*40;path(pts,2,'rgba(255,255,255,.6)');x.setLineDash([])}
 else{const f=Math.min(1,(T-.82)/.1);const loop=pts.slice(Math.floor(pts.length*.36),Math.floor(pts.length*.64));const ps0=meanderPts(.25,w,h);x.globalAlpha=1;path(loop,n?14:20,`rgba(70,130,150,${1-.3*f})`);x.fillStyle='rgba(120,170,90,.6)';const straight=ps0;path(straight,n?14:20,'#3d7fb0');x.setLineDash([6,14]);x.lineDashOffset=-t*40;path(straight,2,'rgba(255,255,255,.6)');x.setLineDash([]);if(f>.5){const m=loop[Math.floor(loop.length/2)];tag(x,'MEANDRO ABANDONADO (lago en herradura)',m[0],m[1]-26,n)}tag(x,'el río corta el cuello y sigue recto',w/2,h*.55+30,n)}
 if(!cut){const k=Math.floor(pts.length*.42);tag(x,'orilla cóncava: el agua va más rápida y erosiona',pts[k][0],pts[k][1]-30,n);const k2=Math.floor(pts.length*.62);tag(x,'orilla convexa: el agua va lenta y deposita arena',pts[k2][0],pts[k2][1]+40,n)}
 txt(x,'vista desde arriba',10,22,{a:'left',s:n?12:15,w:900,c:'#163024',bg:'rgba(255,255,255,.7)'})}
/* ---------- 4 · barrancos canarios ---------- */
const BAR=[...Array(13)].map((_,k)=>({a:-Math.PI*.95+k*Math.PI*1.9/12+(hash(k)-.5)*.12,w:.05+.03*hash(k+3)}));
function islandZ(T){return (u,v)=>{const X=(u-.5)*1.5,Y=(v-.12)*1.6,r=Math.hypot(X,Y),a=Math.atan2(X,Y);let z=.75*Math.max(0,1-Math.pow(r/1.05,1.25))*(1-.2*T)-.1;z+=.03*NZ(u*6,v*6);let cut=0;for(const b of BAR){let da=a-b.a;da=Math.atan2(Math.sin(da),Math.cos(da));const lat=Math.abs(da)*r,wd=b.w*(.25+.75*T)*(.3+r);if(lat<wd&&r>.1){const prof=(.02+.2*T)*Math.sin(Math.min(1,r/1.0)*Math.PI*.9)*Math.pow(1-lat/wd,1.4);cut=Math.max(cut,prof)}}return z-cut}}
function drawBarranco(x,w,h,d,t){sky(x,w,h,'#7fb3d8','#e8f1f5');const n=w<560,q=Math.round(T*30)/30,rain=opt.barranco==='lluvia';const zf=islandZ(q);const c=R.cached('bar'+q,w,h,d,cx=>R.block(cx,w,h,{z:zf,N:120,M:70,color:(u,v,z,s)=>z<.01?[214,198,150]:s>1.1?[120,96,78]:mix([140,128,96],[96,110,72],clamp(z*1.3,0,1)),water:(u,v)=>-.02,strata:[[0,'#5a4a3e'],[.2,'#3e342e'],[.4,'#2a2420']],v:{top:.3,hz:.36}}));x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 if(rain){x.fillStyle='rgba(70,80,95,.35)';x.fillRect(0,0,w,h*.35);x.strokeStyle='rgba(200,215,230,.45)';x.lineWidth=1;for(let i=0;i<120;i++){const px=(hash(i)*w+t*40)%w,py=((hash(i*3)*h*.8+t*500)%(h*.8));x.beginPath();x.moveTo(px,py);x.lineTo(px-3,py+10);x.stroke()}
  for(const b of BAR)for(let i=0;i<8;i++){const ph=(t*.25+i/8+hash(b.a*10))%1,r=.12+ph*.95,X=Math.sin(b.a)*r/1.5+.5,Y=Math.cos(b.a)*r/1.6+.12;if(X<0||X>1||Y<0||Y>1)continue;const [px,py]=P(X,Y,zf(X,Y)+.01);x.fillStyle='rgba(140,100,60,.9)';x.beginPath();x.arc(px,py,2.6,0,7);x.fill()}
  for(const b of BAR){const r=1.06,X=Math.sin(b.a)*r/1.5+.5,Y=Math.cos(b.a)*r/1.6+.12;if(X<0||X>1||Y>1)continue;const [px,py]=P(X,Y,-.02);x.fillStyle='rgba(140,100,60,.45)';x.beginPath();x.ellipse(px,py,14+6*Math.sin(t*2),6,0,0,7);x.fill()}}
 txt(x,q<.3?'isla joven: barrancos poco profundos (El Hierro, La Palma)':q<.7?'isla de edad media (Tenerife)':'isla antigua: barrancos profundos y cumbres rebajadas (La Gomera, Gran Canaria)',10,22,{a:'left',s:n?10.5:13.5,w:900,c:'#163024',bg:'rgba(255,255,255,.75)'});
 if(!rain)tag(x,'cauces secos casi todo el año',w*.5,h*.92,n);else tag(x,'¡aguacero! el barranco «corre» y arrastra piedras y barro',w*.5,h*.92,n)}
/* ---------- 5 · delta y estuario ---------- */
function deltaZ(T,mode){return (u,v)=>{let z;const land=.62;if(v<land){z=.03+(land-v)*.2+.015*NZ(u*5,v*5);z*=clamp((land-v)/.08,0,1)*.85+.15;const d=Math.abs(u-.5-.03*Math.sin(v*9));const W=mode==='estuario'?.025+.18*Math.pow(clamp((v-.25)/(land-.25),0,1),2.2):.022,bed=mode==='estuario'?-.035:.004,bank=W*2.5;if(d<bank){const f=d<W?0:Math.pow((d-W)/(bank-W),1.3);z=Math.min(z,bed+(z-bed)*f)}}else{z=-.03-(v-land)*.45}
  if(mode==='delta'){const ext=.06+.28*T,dv=v-land+.02;if(dv>-.02&&dv<ext){const wd=(.06+.5*dv/ext*.5)*(1+T);const fan=Math.exp(-Math.pow((u-.5)/(wd),2));const front=1/(1+Math.exp((dv-ext*.92)/.012));const top=.03-dv*.04;z=Math.max(z,top*fan*front+z*(1-fan*front));
    for(let k=-2;k<=2;k++){const ang=k*.32*(.6+T),cu=.5+Math.sin(ang)*dv*1.2;if(Math.abs(u-cu)<.008&&dv<ext*.95)z=Math.min(z,-.005)}}}
  return z}}
function drawDelta(x,w,h,d,t){sky(x,w,h);const n=w<560,mode=opt.delta||'delta',q=Math.round(T*30)/30;const tide=mode==='estuario'?.025*Math.sin(t*.8):0;const zf=deltaZ(q,mode);const key='dl'+mode+q+(mode==='estuario'?Math.round(tide*200):'');
 const c=R.cached(key,w,h,d,cx=>R.block(cx,w,h,{z:zf,N:110,M:70,color:(u,v,z,s)=>z<tide+.004?(mode==='estuario'&&z>-.04?[120,110,80]:[200,186,140]):z<.05?(mode==='estuario'?[110,130,70]:[150,160,90]):landColor(z,s),water:(u,v)=>tide+(mode==='delta'?0:0),wcolor:[52,112,150],strata:[[0,'#6e5a44'],[.15,'#8a7456'],[.35,'#5a4a3a']],v:{top:.26,hz:.5}}));x.drawImage(c.cv,0,0,w,h);const P=c.r.P;
 if(mode==='delta'){for(let i=0;i<40;i++){const ph=(t*.08+i/40)%1,k=(i%5)-2,ang=k*.32*(.6+q),dv=ph*(.06+.28*q),cu=.5+Math.sin(ang)*dv*1.2,[px,py]=P(i%5===2&&ph<.3?.5:cu,.6+dv,.01);x.fillStyle='rgba(170,130,80,.9)';x.beginPath();x.arc(px,py,2,0,7);x.fill()}
  const [px,py]=P(.5,.62+.06+.28*q,.02);tag(x,'el río deposita sedimentos y gana terreno al mar',px,py+28,n);const [ax,ay]=P(.62,.66,.04);tag(x,'brazos o canales distributarios',ax+40,ay,n)}
 else{const [px,py]=P(.5,.58,0);tag(x,tide>0?'marea alta: el mar entra río arriba':'marea baja: aparecen marismas y bancos de fango',px,py-30,n);for(let i=0;i<30;i++){const ph=(t*.1+i/30)%1,v=.3+ph*.45,[a,b]=P(.5+(hash(i)-.5)*.2*((v-.25)/.4),v,tide);x.fillStyle='rgba(255,255,255,.6)';x.fillRect(a,b,2,2)}}
 txt(x,mode==='delta'?'DELTA: el río aporta más sedimentos de los que el mar puede llevarse':'ESTUARIO: las mareas y las olas se llevan los sedimentos',10,22,{a:'left',s:n?10.5:13.5,w:900,c:'#163024',bg:'rgba(255,255,255,.75)'})}
STEPS=[
 {k:'Del monte al mar',v:'tramos',t:'El trabajo de los ríos: erosionar, transportar y sedimentar',p:'Un río trabaja como una cinta transportadora. En su <b>curso alto</b>, con mucha pendiente, el agua corre deprisa y <b>erosiona</b>: excava su cauce y arranca piedras. En el <b>curso medio</b> <b>transporta</b> lo que arrastra, que se va desgastando y haciendo más pequeño. En el <b>curso bajo</b>, casi sin pendiente, el agua pierde fuerza y <b>sedimenta</b>: deja la arena y el limo en llanuras, deltas y playas. Fíjate en el tamaño de las piedras que viajan por el río.'},
 {k:'Valle en V',v:'valleV',time:'Tiempo',dur:14,t:'Cómo excava un río su valle',p:'El río ahonda su cauce poco a poco, sobre todo durante las crecidas, cuando lleva más agua y más piedras que golpean el fondo. Al mismo tiempo, las laderas se desmoronan por la lluvia, el hielo y la gravedad. El resultado es un valle con forma de <b>V</b>. Pulsa ▶ y observa cómo se encaja el río y aparecen las capas de roca en las paredes.'},
 {k:'Meandros',v:'meandros',time:'Tiempo',dur:16,loop:false,t:'Meandros y lagos en herradura',p:'En las llanuras, el río forma curvas: los <b>meandros</b>. En la orilla exterior (cóncava) el agua va más rápida y la <b>erosiona</b>; en la interior (convexa) va más lenta y <b>deposita</b> arena. Así las curvas crecen y se desplazan, hasta que el río corta el «cuello» del meandro durante una crecida y lo deja abandonado como un <b>lago en herradura</b>.'},
 {k:'Barrancos canarios',v:'barranco',time:'Edad de la isla',dur:16,o:[['seco','☀ Tiempo seco'],['lluvia','🌧 Aguacero']],ol:'Tiempo atmosférico',t:'Los barrancos de Canarias',p:'En Canarias casi no hay ríos permanentes: hay <b>barrancos</b>. Pasan secos la mayor parte del año, pero con las lluvias torrenciales «corren» con enorme fuerza, arrastran piedras y barro y excavan su cauce. Por eso las islas más antiguas, como <b>La Gomera</b> o <b>Gran Canaria</b>, tienen barrancos profundos que bajan en abanico desde la cumbre, y las más jóvenes, como <b>El Hierro</b> o <b>La Palma</b>, casi no tienen. Mueve la edad de la isla y prueba un aguacero.'},
 {k:'Delta o estuario',v:'delta',time:'Tiempo',dur:14,resetT:true,o:[['delta','Delta'],['estuario','Estuario']],ol:'Desembocadura',t:'¿Delta o estuario? Quién gana: el río o el mar',p:'Cuando un río llega al mar, todo depende de quién tiene más fuerza. Si el río trae <b>muchos sedimentos</b> y el mar tiene poca marea y pocas olas, los sedimentos se acumulan y el río gana terreno al mar formando un <b>delta</b>, con varios brazos (Ebro, Nilo, Misisipi). Si las <b>mareas</b> y las <b>olas</b> son fuertes, se llevan los sedimentos y la desembocadura se ensancha en forma de embudo: es un <b>estuario</b> (Tajo, Guadalquivir, Támesis). Las <b>rías</b> gallegas son valles fluviales inundados por el mar.'}];
DRAW={tramos:drawTramos,valleV:drawValleV,meandros:drawMeandros,barranco:drawBarranco,delta:drawDelta};
INFO={tramos:()=>'Las piedras grandes y angulosas del curso alto se van rompiendo y redondeando por el camino: cerca de la desembocadura el río solo lleva arena, limo y arcilla. Por eso los cantos de los ríos son redondeados.',
 valleV:()=>T<.2?'Al principio el río corre sobre una superficie casi llana.':T<.7?'El río se encaja y las laderas se desmoronan hacia el cauce.':'Un valle en <b>V</b>: el fondo es estrecho, ocupado solo por el río. Ejemplos: el desfiladero de La Hermida (Cantabria), las hoces del Duratón (Segovia).',
 meandros:()=>T>.82?'El río ha cortado el meandro: el antiguo cauce queda como un <b>lago en herradura</b> que poco a poco se rellena de sedimentos y vegetación.':'Las curvas crecen: el río erosiona la orilla exterior (rayas rojas) y deposita arena en la interior (manchas claras).',
 barranco:()=>(opt.barranco==='lluvia'?'Un aguacero de pocas horas puede mover más material que años de tiempo seco: por eso los barrancos son peligrosos y no se debe construir en sus cauces. ':'')+'Edad aproximada de la superficie: '+(T<.3?'menos de 2 millones de años':T<.7?'varios millones de años':'más de 10 millones de años')+'. Ejemplos: barranco del Infierno (Tenerife), barranco de Guayadeque (Gran Canaria), barranco de las Angustias (La Palma).',
 delta:()=>opt.delta==='estuario'?'En los estuarios se mezclan el agua dulce y la salada y hay <b>marismas</b> muy ricas en vida, como las del Guadalquivir (Doñana).':'El delta del <b>Ebro</b> creció mucho durante siglos, pero hoy retrocede porque los embalses retienen los sedimentos que antes llegaban al mar.'};
LEG={tramos:'Piedras grandes y oscuras arriba; arena clara abajo.',valleV:'En las paredes del valle se ven las capas de roca que el río ha cortado.',meandros:'<span style="color:#ff7a6a">▬</span> erosión · <span style="color:#e1cd96">●</span> sedimentación (barra de arena)',barranco:'Cauces secos que solo llevan agua durante las lluvias fuertes.',delta:()=>opt.delta==='estuario'?'Marisma: terreno que se inunda con la marea alta.':'Brazos del río abriéndose en abanico sobre sus propios sedimentos.'};

function renderSteps(){$('steps').innerHTML=STEPS.map((s,i)=>`<button class="${i===step?'on':''}" data-i="${i}">${i+1} · ${s.k}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function renderOpt(){const s=STEPS[step];if(!s.o){$('optBox').style.display='none';return}$('optBox').style.display='';$('optLab').textContent=s.ol;if(opt[s.v]==null)opt[s.v]=s.o[0][0];$('opt').innerHTML=s.o.map(([k,n])=>`<button data-k="${k}" class="${opt[s.v]===k?'on':''}">${n}</button>`).join('');$('opt').querySelectorAll('button').forEach(b=>b.onclick=()=>{opt[s.v]=b.dataset.k;if(s.resetT)T=0;renderOpt();info();legend()})}
function legend(){const v=STEPS[step].v;$('legend').innerHTML=typeof LEG[v]==='function'?LEG[v]():(LEG[v]||'')}
function info(){const v=STEPS[step].v;$('info').innerHTML=INFO[v]?INFO[v]():''}
function go(i){step=i;const s=STEPS[i];$('stage').innerHTML=`<b class="t">${s.t}</b><p>${s.p}</p>`;renderSteps();renderOpt();$('timeBox').style.display=s.time?'':'none';if(s.time)$('timeLab').innerHTML=s.time;T=s.t0??0;playing=!!s.autoplay;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir';document.querySelectorAll('[data-show]').forEach(el=>el.style.display=el.dataset.show.split(' ').includes(s.v)?'':'none');legend();info()}
$('time').oninput=()=>{T=+$('time').value;playing=false;$('play').textContent='▶ Reproducir';info()};
$('play').onclick=()=>{if(T>=1)T=0;playing=!playing;$('play').textContent=playing?'⏸ Pausa':'▶ Reproducir'};
$('reset').onclick=()=>{T=0;info()};
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;const s=STEPS[step];if(playing&&s.time){T=Math.min(1,T+dt/(s.dur||14));if(T>=1){if(s.loop)T=0;else{playing=false;$('play').textContent='▶ Reproducir'}}acc+=dt;if(acc>.3){acc=0;info()}}$('time').value=T;
 const {x,w,h,d}=fit($('main'));DRAW[s.v](x,w,h,d,tt);requestAnimationFrame(frame)}
renderSteps();go(0);requestAnimationFrame(frame);
window.__g={go,set T(v){T=v;info()},set opt(v){opt[STEPS[step].v]=v;renderOpt();info();legend()}};
})();
</script>
</body>
