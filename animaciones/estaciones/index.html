<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANAMBRO · Las estaciones</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eef5f8;background:#07131d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#17314b 0,#07131d 55%,#02080d 100%);min-height:100vh}.app{max-width:1100px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{font-size:clamp(18px,3vw,30px);margin:0}.badge{padding:5px 9px;border-radius:999px;background:#15354c;border:1px solid #41657a;font-weight:800;font-size:12px}.stage{margin:10px 0;padding:10px 12px;background:#0d2231;border:1px solid #2d536a;border-radius:12px;min-height:70px}.stage b{color:#ffdc76}.stage p{margin:5px 0 0;line-height:1.35}.viz{width:100%;aspect-ratio:16/8.6;display:block;background:linear-gradient(#07131d,#091925);border:1px solid #294b61;border-radius:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.controls button,.controls select{min-height:42px;border:1px solid #5e8094;border-radius:9px;background:#102b3d;color:#fff;padding:8px 12px;font-weight:800}.controls button.primary{background:#176c6a}.controls button:disabled{opacity:.4}.dots{display:flex;gap:5px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#486575}.dot.on{background:#ffce5c}.compare{margin-top:10px;padding:9px 11px;background:#0e2534;border-radius:10px;border:1px solid #305369;font-size:13px;line-height:1.35}.small{font-size:11px;color:#a9c0cd}@media(max-width:600px){.app{padding:8px}.stage{font-size:13px}.controls button,.controls select{flex:1}.viz{aspect-ratio:4/3}}</style></head><body><main class="app"><div class="top"><h1>🌍 Las estaciones del año</h1><span class="badge" id="stepBadge">1 / 7</span></div><section class="stage" id="stageText"></section><svg class="viz" id="svg" viewBox="0 0 1000 540" role="img" aria-label="Animación esquemática de las estaciones"></svg><div class="controls"><button id="prev">◀ Anterior</button><button id="play" class="primary">▶ Explicación</button><button id="next">Siguiente ▶</button><select id="place"><option value="28">Comparar: Canarias · 28° N</option><option value="0">Ecuador · 0°</option><option value="50">50° N</option><option value="-35">35° S</option></select></div><div class="dots" id="dots" aria-hidden="true"></div><div class="compare" id="compare"></div><p class="small">Esquema didáctico, no a escala. La inclinación del eje terrestre es aproximadamente 23,5° y mantiene casi constante su orientación durante la traslación.</p></main><script>
(()=>{const svg=document.getElementById('svg'),text=document.getElementById('stageText'),badge=document.getElementById('stepBadge'),compare=document.getElementById('compare'),place=document.getElementById('place');let i=0,timer=0;const NS='http://www.w3.org/2000/svg';const stages=[
 {t:'No es la distancia',p:'La Tierra no tiene verano porque esté “más cerca” del Sol. Las estaciones se explican por la <b>inclinación del eje</b> y la traslación.'},
 {t:'El eje está inclinado 23,5°',p:'El eje de rotación conserva casi la misma orientación mientras la Tierra recorre su órbita.'},
 {t:'Equinoccio de marzo',p:'Ningún hemisferio está inclinado hacia el Sol. Día y noche duran aproximadamente lo mismo: comienza la primavera en el norte y el otoño en el sur.'},
 {t:'Solsticio de junio',p:'El hemisferio norte queda inclinado hacia el Sol: mayor altura solar y días más largos. En el sur sucede lo contrario.'},
 {t:'Equinoccio de septiembre',p:'De nuevo ninguno de los hemisferios domina la iluminación: otoño en el norte y primavera en el sur.'},
 {t:'Solsticio de diciembre',p:'El hemisferio sur queda inclinado hacia el Sol. En el norte los días son más cortos y el Sol alcanza menor altura.'},
 {t:'Una misma Tierra, estaciones opuestas',p:'Cuando un hemisferio recibe rayos más directos y tiene días más largos, el otro recibe rayos más oblicuos y días más cortos. La estación depende de la <b>geometría de la iluminación</b>.'}
];function el(n,a={}){const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);svg.appendChild(x);return x}function tx(x,y,s,size=18,anchor='middle'){const e=el('text',{x,y,fill:'#eef5f8','font-size':size,'font-weight':'800','text-anchor':anchor});e.textContent=s;return e}function clear(){svg.replaceChildren()}function sun(x=500,y=270,r=58){el('circle',{cx:x,cy:y,r,fill:'#ffd34d'});el('circle',{cx:x,cy:y,r:r+16,fill:'none',stroke:'#ffd34d','stroke-opacity':.22,'stroke-width':12})}function earth(x,y,season=0){el('circle',{cx:x,cy:y,r:61,fill:'#2b7ab2',stroke:'#b7d5e6','stroke-width':2});el('path',{d:`M${x-44},${y-12}q28-28 56-8t34 34q-34 11-58 0t-32-36`,fill:'#4f9d57','fill-opacity':.9});const ang=-23.5*Math.PI/180,dx=Math.sin(ang)*92,dy=Math.cos(ang)*92;el('line',{x1:x-dx,y1:y+dy,x2:x+dx,y2:y-dy,stroke:'#f7f7f7','stroke-width':3});tx(x+dx+8,y-dy-4,'N',14,'start');return{x,y}}function rays(x1,x2,y0=185,y1=355){for(let y=y0;y<=y1;y+=34){el('line',{x1,y1:y,x2,y2:y,stroke:'#ffd45f','stroke-width':3,'stroke-opacity':.78})}}function orbit(){el('ellipse',{cx:500,cy:270,rx:365,ry:165,fill:'none',stroke:'#6b8797','stroke-width':2,'stroke-dasharray':'7 8'})}function draw(){clear();const st=stages[i];text.innerHTML='<b>'+st.t+'</b><p>'+st.p+'</p>';badge.textContent=(i+1)+' / '+stages.length;document.getElementById('dots').innerHTML=stages.map((_,j)=>'<span class="dot '+(j===i?'on':'')+'"></span>').join('');if(i===0){sun(235,270,64);earth(725,270);tx(500,80,'Idea clave: las estaciones NO dependen de estar más cerca o más lejos del Sol',19);el('line',{x1:305,y1:270,x2:650,y2:270,stroke:'#768f9e','stroke-width':2,'stroke-dasharray':'8 8'});tx(500,300,'distancia Tierra–Sol',14)}else if(i===1){sun(220,270,60);orbit();earth(500,105);earth(850,270);earth(500,435);earth(150,270);tx(500,38,'El eje mantiene su orientación durante toda la órbita',20)}else{orbit();sun(500,270,54);const pos={2:[150,270,'MARZO'],3:[500,105,'JUNIO'],4:[850,270,'SEPTIEMBRE'],5:[500,435,'DICIEMBRE'],6:[500,105,'NORTE: verano']}[i];if(i<6){earth(pos[0],pos[1]);const sx=pos[0],sy=pos[1],vx=500-sx,vy=270-sy,L=Math.hypot(vx,vy),ux=vx/L,uy=vy/L,px=-uy,py=ux;for(let a=-90;a<=90;a+=36){el('line',{x1:500+px*a+ux*58,y1:270+py*a+uy*58,x2:sx+px*a-ux*62,y2:sy+py*a-uy*62,stroke:'#ffd45f','stroke-width':3,'stroke-opacity':.78})}tx(sx,sy+92,pos[2],17)}else{earth(500,270);rays(120,420,190,350);tx(500,470,'Norte y sur viven estaciones opuestas',21)}}updateCompare()}function updateCompare(){const lat=+place.value,n=Math.abs(lat),hem=lat<0?'sur':lat>0?'norte':'ecuador';let s='';if(i===3)s=lat===0?'En el ecuador la duración del día cambia poco a lo largo del año.':hem==='norte'?`A ${n}° N, como referencia, el Sol alcanza mayor altura y el día es más largo que en diciembre.`:`A ${n}° S ocurre el invierno austral: menor altura solar y días más cortos.`;else if(i===5)s=lat===0?'En el ecuador continúa habiendo poca variación estacional de la duración del día.':hem==='sur'?`A ${n}° S es verano austral: mayor altura solar y días más largos.`:`A ${n}° N es invierno: menor altura solar y días más cortos.`;else if(i===2||i===4)s='En los equinoccios la duración del día y de la noche es aproximadamente igual en todo el planeta.';else s='Selecciona una latitud y avanza hasta un equinoccio o solsticio para comparar su efecto.';compare.innerHTML='<b>📍 Comparación por latitud:</b> '+s}function set(n){i=(n+stages.length)%stages.length;draw()}document.getElementById('prev').onclick=()=>{stop();set(i-1)};document.getElementById('next').onclick=()=>{stop();set(i+1)};place.onchange=updateCompare;function stop(){clearInterval(timer);timer=0;document.getElementById('play').textContent='▶ Explicación'}document.getElementById('play').onclick=()=>{if(timer){stop();return}document.getElementById('play').textContent='⏸ Pausar';timer=setInterval(()=>{if(i===stages.length-1){stop();return}set(i+1)},2600)};draw();})();
</script></body></html>
